// ---------- PRACTICE DASHBOARD ----------
function dashboardViewHTML(){
  const rows = clients.map(c=>{
    const cap = riskCapacityScore(c), pref = riskPreferenceScore(c), ps = portfolioScore(c);
    const band = (ps!==null && cap!==null && pref!==null) ? inBand(ps, cap, pref) : null;
    const daysSince = c.reviewDate ? Math.floor((Date.now() - new Date(c.reviewDate).getTime()) / 86400000) : null;
    return {c, band, daysSince};
  });

  const outOfBand = rows.filter(r=>r.band===false).length;
  const staleReviews = rows.filter(r=>r.daysSince===null || r.daysSince>365).length;
  const totalClients = clients.length;

  const sorted = rows.slice().sort((a,b)=>{
    const av = a.daysSince===null ? 99999 : a.daysSince;
    const bv = b.daysSince===null ? 99999 : b.daysSince;
    return bv - av;
  });

  const tableRows = sorted.map(({c, band, daysSince})=>{
    const name = (c.client1.first || c.client1.last) ? `${c.client1.first} ${c.client1.last}`.trim() : 'New client';
    const reviewLabel = daysSince===null ? 'Never reviewed' : `${daysSince} days ago`;
    // Never-reviewed is a neutral "hasn't happened yet" state, not the same as a lapsed review — only
    // flag red once there's an actual prior review that's now stale, so a brand-new client doesn't
    // read as "overdue" the moment they're created.
    const reviewFlag = daysSince===null ? 'warn' : daysSince>365 ? 'err' : daysSince>270 ? 'warn' : 'ok';
    const bandFlag = band===null ? '' : band ? '<span class="flag ok">In band</span>' : '<span class="flag err">Out of band</span>';
    return `<tr>
      <td>${name}</td>
      <td><span class="flag ${reviewFlag}">${reviewLabel}</span></td>
      <td>${bandFlag}</td>
      <td><button class="btn ghost" onclick="selectClient('${c.id}')">Open</button></td>
    </tr>`;
  }).join('');

  return `
    <h1>Practice Dashboard</h1>
    <p class="sub">Everything at a glance — no clicking into each client to find out what needs attention.</p>
    <div class="summary-cards">
      <div class="scard"><div class="label">Total clients</div><div class="value">${totalClients}</div></div>
      <div class="scard ${outOfBand?'bad':'good'}"><div class="label">Out of risk band</div><div class="value">${outOfBand}</div></div>
      <div class="scard ${staleReviews?'warn':'good'}"><div class="label">Needs Review</div><div class="value">${staleReviews}</div></div>
      <div class="scard"><div class="label">Pending submissions</div><div class="value" id="dashPendingValue">${pendingCount}</div></div>
    </div>
    <div class="panel">
      <h2>Clients — sorted by review staleness</h2>
      ${totalClients ? `<table>
        <thead><tr><th>Client</th><th>Last review</th><th>Risk band</th><th></th></tr></thead>
        <tbody>${tableRows}</tbody>
      </table>` : '<div class="empty">No clients yet.</div>'}
    </div>
    <footer class="tool-foot">Redmount Capital Partners — internal use</footer>
  `;
}

// ---------- MODEL PORTFOLIOS ----------
// Firm-wide, reusable allocations — save one once, then apply it to any
// client's Proposed Portfolio scenario to populate tickers/asset
// classes/percentages in one click instead of re-entering the same
// favorite mix by hand every time.
// Weighted-average risk score for a model, using each holding's saved
// percentage as the weight (models don't carry dollar amounts — pct is the
// only weighting basis they have). Same lookup as portfolioScore/
// accountScore, just weighted by pct instead of dollar value.
function modelScore(model){
  let totalPct = 0, weighted = 0;
  model.holdings.forEach(h=>{
    const pct = parseFloat(h.pct) || 0;
    const score = resolveHoldingScore(h);
    if(pct>0 && score!==null){ totalPct += pct; weighted += pct*score; }
  });
  if(totalPct===0) return null;
  return Math.round(weighted/totalPct);
}

// Applies a saved model to the client's current scenario — converts each
// holding's saved percentage into a dollar amount. When an account tab is
// selected (see ACCOUNT_FILTER_UNASSIGNED / the account sub-tabs in
// proposedTabHTML), the model replaces only that account's proposed
// holdings, sized off that account's own current value rather than the
// whole scenario's — so applying a model to just the SEP IRA doesn't touch
// the 401k's existing proposed holdings or require the whole-scenario total
// to be set. With "All accounts" selected, behavior is unchanged: it sizes
// off the scenario's Total Portfolio Value and replaces every holding.
function applyModelPortfolio(cid, modelId){
  if(!modelId) return;
  const c = getClient(cid);
  const scenario = activeScenario(c);
  const filter = scenario.activeAccountFilter || '';
  const scopedAccount = (filter && filter!==ACCOUNT_FILTER_UNASSIGNED) ? c.accounts.find(a=>a.id===filter) : null;
  const model = modelPortfolios.find(m=>m.id===modelId);
  if(!model || !model.holdings.length) return;

  let total, existingCount, applyAccountId;
  if(scopedAccount){
    total = accountValue(scopedAccount);
    if(total <= 0){
      alert(`"${scopedAccount.name}" has no current holdings value to size the model against — add its current holdings first, or switch to "All accounts" and set a Total Portfolio Value.`);
      return;
    }
    existingCount = holdingsForAccount(scenario, scopedAccount.id, c).length;
    applyAccountId = scopedAccount.id;
  } else if(filter===ACCOUNT_FILTER_UNASSIGNED){
    total = scenarioTargetTotal(scenario, c);
    if(total <= 0){ alert('Set a "Total portfolio value to allocate" for this scenario first — the model\'s percentages need a dollar total to convert into holding amounts.'); return; }
    existingCount = holdingsForAccount(scenario, '', c).length;
    applyAccountId = '';
  } else {
    if(scenarioAccounts(scenario, c).length > 1){
      // "All accounts" is a blended view across several tagged accounts —
      // applying a model here has no single account to land on, and used to
      // silently wipe every account's holdings at once (data loss disguised
      // as a normal action). Force picking a specific account or Unassigned
      // first, same as the other two branches above already require.
      alert('This scenario has more than one account, so a model portfolio needs a specific target. Pick an account tab (or "Unassigned") above, then apply the model there — it will only replace that account\'s holdings.');
      return;
    }
    total = scenarioTargetTotal(scenario, c);
    if(total <= 0){ alert('Set a "Total portfolio value to allocate" for this scenario first — the model\'s percentages need a dollar total to convert into holding amounts.'); return; }
    existingCount = scenario.holdings.length;
    applyAccountId = null; // null = replace the whole scenario, not one bucket
  }

  const label = scopedAccount ? `"${scopedAccount.name}"` : (filter===ACCOUNT_FILTER_UNASSIGNED ? 'the Unassigned holdings' : 'this scenario');
  if(existingCount && !confirm(`This replaces the ${existingCount} holding(s) already modeled for ${label} with "${model.name}". Continue?`)) return;

  const fresh = model.holdings.map(h => ({
    ticker: h.ticker,
    assetClass: h.assetClass,
    value: Math.round((parseFloat(h.pct)||0)/100 * total),
    accountId: applyAccountId===null ? '' : applyAccountId
  }));
  if(applyAccountId===null){
    scenario.holdings = fresh;
  } else {
    const kept = (scenario.holdings||[]).filter(h=>accountKeyFor(h,c,scenario)!==applyAccountId);
    scenario.holdings = [...kept, ...fresh];
  }
  renderAll();
}

function bulkAddSecurities(){
  const raw = document.getElementById('bulkPaste').value;
  const lines = raw.trim().split(/\r?\n/).filter(l=>l.trim());
  let added = 0, updated = 0, skipped = 0;
  const validClasses = ASSET_CLASSES.map(a=>a.key);
  lines.forEach(line=>{
    const parts = line.split(',').map(p=>p.trim());
    if(parts.length < 4){ skipped++; return; }
    const [tickerRaw, name, assetClassRaw, scoreRaw, erRaw] = parts;
    const ticker = tickerRaw.toUpperCase();
    const assetClass = validClasses.includes(assetClassRaw) ? assetClassRaw : 'us_large';
    const score = Math.max(0, Math.min(100, parseFloat(scoreRaw) || 0));
    const expenseRatio = erRaw!==undefined ? Math.max(0, parseFloat(erRaw)||0) : 0;
    if(!ticker){ skipped++; return; }
    const existing = securityLibrary.find(s=>s.ticker===ticker);
    if(existing){
      existing.name = name; existing.assetClass = assetClass; existing.score = score; existing.expenseRatio = expenseRatio;
      updated++;
    } else {
      securityLibrary.push({ticker, name, assetClass, score, expenseRatio});
      added++;
    }
  });
  document.getElementById('bulkStatus').textContent = `${added} added, ${updated} updated${skipped?`, ${skipped} skipped (bad format)`:''}.`;
  document.getElementById('bulkPaste').value = '';
  renderMain();
}

}

function holdingWarnings(holdings){
  const warnings = {};
  const seen = {};
  holdings.forEach((h,i)=>{
    const val = parseFloat(h.value);
    const msgs = [];
    if(!h.value || isNaN(val) || val<=0) msgs.push('No positive value entered');
    if(h.ticker){
      const t = h.ticker.trim().toUpperCase();
      if(t){ seen[t] = seen[t] || []; seen[t].push(i); }
    }
    if(msgs.length) warnings[i] = msgs;
  });
  Object.values(seen).forEach(idxs=>{
    if(idxs.length>1) idxs.forEach(i=>{ warnings[i] = (warnings[i]||[]).concat('Duplicate ticker in this list'); });
  });
  return warnings;
}

function warningBadgeHTML(msgs){
  if(!msgs || !msgs.length) return '';
  return `<span class="flag warn" style="margin-left:6px;" title="${msgs.join('; ')}">⚠ ${msgs[0]}</span>`;
}

  const total = holdings.reduce((s,h)=>s+(parseFloat(h.value)||0),0);

  const accountManagementHTML = `

        : 'Add a hypothetical account to illustrate one the client does not have yet (e.g. "Cash Management Account") — it exists only in this scenario. Note where its proposed money would come from (a rollover, new deposit) so the report does not imply it appears from nowhere. Uncheck a real account to leave it out of this scenario\'s totals, tabs and report entirely.'}</p>

  return `
  <div class="panel">

        <button class="btn" onclick="downloadComparisonPDF('${c.id}')">Download Comparison Report</button>

      ${isProposalOnly ? '' : `
      <div class="field" style="max-width:280px; flex:0 0 auto;">
        <label>&nbsp;</label>
        <button class="btn secondary" style="flex-shrink:0; white-space:normal; height:auto;" onclick="copyCurrentToProposed('${c.id}')">${copyButtonLabel}</button>
      </div>
      ${realAccountsInScenario.length>1 ? `
      <div class="field" style="flex:1 1 320px; min-width:260px;">
        <label>Copy which accounts?</label>
        <div style="display:flex; flex-wrap:wrap; gap:4px 14px; padding:9px 0;">
          ${realAccountsInScenario.map(acc=>`<label style="display:flex; align-items:center; gap:5px; font-weight:normal; text-transform:none; letter-spacing:normal; font-size:12.5px; color:var(--ink); cursor:pointer;">
            <input type="checkbox" ${copySelection.includes(acc.id)?'checked':''} onchange="toggleCopySelection('${c.id}','${acc.id}')"> ${esc(acc.name)}
          </label>`).join('')}
        </div>

      ${modelPortfolios.length ? (multiAccount && !filter ? `
      <div class="field" style="max-width:260px;">
        <label>Apply a model portfolio</label>
        <div style="font-size:11.5px; color:var(--ink-dim); padding:9px 0;">Pick an account tab below (or "Unassigned") first — with several accounts in this scenario, a model needs a specific one to land on.</div>

        <select id="modelPicker_${c.id}" onchange="if(this.value) applyModelPortfolio('${c.id}',this.value); this.value='';">
          <option value="">Choose a model…</option>
          ${modelPortfolios.map(m=>`<option value="${attrEsc(m.id)}">${attrEsc(m.name)}</option>`).join('')}
        </select>
      </div>`) : ''}
    </div>
    <p class="desc">A hypothetical reallocation to model against the client's risk band and current portfolio.${multiAccount ? ' Tag each proposed holding to the account it belongs to (below) so you can model changes to one account — e.g. the SEP IRA — while leaving another, like the 401k, untouched.' : ' Not tied to real accounts.'} Build multiple scenarios to compare options side by side.</p>
    ${accountManagementHTML}
    <div class="field" style="max-width:640px; margin-bottom:14px;">
      <label>Rationale (appears on the Comparison Report, right after the summary)</label>
      <textarea rows="3" placeholder="Why this change — e.g. reduce cash drag, add fixed income for income needs, align with revised risk tolerance…" onchange="updateScenarioRationale('${c.id}',this.value)">${attrEsc(scenario.rationale||'')}</textarea>
    </div>
    ${accountSummaryHTML}
    <div class="row" style="align-items:flex-end; margin-bottom:14px;">
      <div class="field" style="max-width:280px;">
        <label style="white-space:nowrap;">Total portfolio value ($)${targetTotalIsAuto ? ' <span style="font-weight:400; text-transform:none; letter-spacing:normal; color:var(--ink-dim); font-size:11px;">(auto)</span>' : ''}</label>
        <input type="text" inputmode="decimal" placeholder="e.g. 1,000,000" value="${attrEsc(targetTotalIsAuto ? (targetTotal>0 ? formatMoneyDisplay(Math.round(targetTotal)) : '') : (scenario.targetTotal===''||scenario.targetTotal===null||scenario.targetTotal===undefined ? '' : formatMoneyDisplay(scenario.targetTotal)))}" oninput="onMoneyInput(this)" onchange="updateScenarioTotal('${c.id}',moneyVal(this.value))">

          : `<div style="font-size:11px; margin-top:3px;"><a href="javascript:void(0)" onclick="resetScenarioTargetAuto('${c.id}')" style="color:var(--ink-dim);">↺ Back to auto (current: $${scenarioCurrentValue(scenario,c).toLocaleString(undefined,{maximumFractionDigits:0})})</a></div>`}
      </div>

          ${allocStatus==='ok' ? '✓ ' : ''}Allocated: $${total.toLocaleString(undefined,{maximumFractionDigits:0})} of $${targetTotal.toLocaleString(undefined,{maximumFractionDigits:0})} (${allocPct.toFixed(1)}%)${allocStatus==='over' ? ' — over 100%' : (allocStatus==='under' ? ' — under 100%' : '')}

    </div>`;
      }
      const touched = scenarioTouchesAccount(scenario, scopedAccount.id, c);
      return `
    <div class="row" style="align-items:center; margin-bottom:10px;">
      <button class="btn ghost" onclick="copyAccountToProposed('${c.id}','${scopedAccount.id}')">Copy current holdings for "${esc(scopedAccount.name)}" into this scenario</button>
      <div style="font-size:12px; color:var(--ink-dim);">${touched
        ? 'Only affects this account — other accounts in this scenario are left as they are.'

    ${boxesSection}
    <div style="text-align:right; font-size:12.5px; color:var(--ink-dim); margin-top:2px;">${filter ? 'Filtered' : 'Proposed'} total: $${visible.reduce((s,{h})=>s+(parseFloat(h.value)||0),0).toLocaleString(undefined,{maximumFractionDigits:0})}${filter ? ` &nbsp;·&nbsp; Scenario total: $${total.toLocaleString(undefined,{maximumFractionDigits:0})}` : ''}</div>
    <div class="divider"></div>

      <input type="file" id="csv_proposed_${c.id}" accept=".csv,.xlsx,.xls" style="display:none;" onchange="handleProposedCSV(event,'${c.id}')">
      Click to upload, drag a file here (CSV or Excel), or paste rows below

}
function updateScenarioTotal(cid, val){
  const c = getClient(cid);
  const scenario = activeScenario(c);
  if(val==='' || val===null || val===undefined){
    // Clearing the field hands control back to the auto-calculated total
    // rather than leaving a stale 0 behind.
    scenario.targetTotal = '';
    scenario.targetTotalAuto = true;
  } else {
    scenario.targetTotal = val;
    scenario.targetTotalAuto = false;
  }
  renderTab();
}
// Drops a manually-entered target total and returns this scenario to
// auto-calculating it from the accounts actually in scope.
function resetScenarioTargetAuto(cid){
  const c = getClient(cid);
  const scenario = activeScenario(c);
  scenario.targetTotal = '';
  scenario.targetTotalAuto = true;
  renderTab();
}
function updateScenarioReportMode(cid, val){
  const c = getClient(cid);
  const scenario = activeScenario(c);
  const prevMode = scenario.reportMode || 'auto';
  scenario.reportMode = val;
  if(val === 'proposal' && prevMode !== 'proposal'){
    // Forcing "New Money / Initial Allocation" is a request for a fresh
    // canvas, not a comparison with the real accounts left in but ignored —
    // leaving them in scope would keep showing them as untouched "current"
    // positions, which is exactly the framing this mode exists to drop.
    scenario.excludedAccountIds = c.accounts.map(a=>a.id);
    scenario.activeAccountFilter = '';
    scenario.copySelection = null;
  } else if(val === 'comparison' && prevMode === 'proposal'){
    // Coming back from a forced new-money canvas: restore the real accounts
    // a comparison report needs something to compare against. Only does
    // this when leaving 'proposal' specifically, so a plain switch into
    // 'comparison' from 'auto' never overrides exclusions set by hand.
    scenario.excludedAccountIds = [];
  }
  renderAll();
}
function updateScenarioRationale(cid, val){
  const c = getClient(cid);
  activeScenario(c).rationale = val;
  renderTab();
}
function updateProposedHoldingPercent(cid, idx, pctStr){
  const c = getClient(cid);
  const scenario = activeScenario(c);
  const h = (scenario.holdings||[])[idx];
  if(!h){ renderTab(); return; }
  // Same base the box's % display uses (holdingPctBase): the holding's own
  // account when several are in play, so a percent typed while editing the
  // SEP IRA lands as that percent of the SEP IRA, not of the blended total.
  const total = holdingPctBase(scenario, c, h);
  if(total <= 0){ renderTab(); return; } // nothing to derive a dollar amount from yet
  const pct = parseFloat(pctStr);
  if(isNaN(pct)){ renderTab(); return; }
  const dollarVal = Math.round((pct/100) * total);
  updateProposedHolding(cid, idx, 'value', String(dollarVal));
}

function switchScenario(cid, sid){
  const c = getClient(cid);
  c.activeScenarioId = sid;
  renderAll();
}
function addScenario(cid){
  const c = getClient(cid);
  const s = {id: uid('sc'), name:`Scenario ${c.proposedScenarios.length+1}`, holdings: [], targetTotal: '', targetTotalAuto: true, rationale: '', activeAccountFilter: '', copySelection: null, extraAccounts: [], excludedAccountIds: [], reportMode: 'auto'};
  c.proposedScenarios.push(s);
  c.activeScenarioId = s.id;
  renderAll();
}
function duplicateScenario(cid){
  const c = getClient(cid);
  const cur = activeScenario(c);
  const copy = {id: uid('sc'), name:`${cur.name} (copy)`, holdings: cur.holdings.map(h=>({...h})), targetTotal: cur.targetTotal||'', targetTotalAuto: cur.targetTotalAuto===false ? false : true, rationale: cur.rationale||'', activeAccountFilter: cur.activeAccountFilter||'', copySelection: cur.copySelection ? cur.copySelection.slice() : null, extraAccounts: (cur.extraAccounts||[]).map(a=>({...a})), excludedAccountIds: (cur.excludedAccountIds||[]).slice(), reportMode: cur.reportMode||'auto'};
  c.proposedScenarios.push(copy);
  c.activeScenarioId = copy.id;
  renderAll();
}
function removeScenario(cid){
  const c = getClient(cid);
  if(c.proposedScenarios.length<=1){
    // Deleting the only remaining scenario would leave activeScenarioId
    // pointing at nothing, which every proposed-portfolio calculation
    // (proposedScore, proposedValue, etc.) assumes always resolves to a
    // real scenario. Replacing it with a fresh blank one gets the "clear
    // this out" result the delete button implies, without leaving the
    // client record in a state nothing downstream expects.
    if(!confirm('This is the only scenario — deleting it will replace it with a fresh blank one. Continue?')) return;
    const fresh = {id: uid('sc'), name:'Scenario 1', holdings: [], targetTotal: '', targetTotalAuto: true, rationale: '', activeAccountFilter: '', copySelection: null, extraAccounts: [], excludedAccountIds: [], reportMode: 'auto'};
    c.proposedScenarios = [fresh];
    c.activeScenarioId = fresh.id;
    renderAll();
    return;
  }
  c.proposedScenarios = c.proposedScenarios.filter(s=>s.id!==c.activeScenarioId);
  c.activeScenarioId = c.proposedScenarios[0].id;
  renderAll();
}
function renameScenario(cid, name){
  const c = getClient(cid);
  activeScenario(c).name = name;
  renderClientList();
}

// Adds a scenario-only hypothetical account — e.g. "Cash Management
// Account" — used purely to illustrate an account the client doesn't have
// yet. It lives only on this scenario (scenario.extraAccounts), never on
// c.accounts, so it never appears in the Current Portfolio tab, other
// scenarios, or the Annual Review.
function addScenarioAccount(cid){
  const c = getClient(cid);
  const scenario = activeScenario(c);
  const name = prompt('Name this new account (e.g. "Cash Management Account"):');
  if(!name || !name.trim()) return;
  scenario.extraAccounts = scenario.extraAccounts || [];
  scenario.extraAccounts.push({id: uid('xa'), name: name.trim(), fundingNote: ''});
  renderAll();
}
// Where a hypothetical account's proposed money is meant to come from — a
// free-text note (e.g. "401k rollover", "new deposit") so a new account
// illustrated in a scenario doesn't read as money conjured from nowhere.
// Purely descriptive: nothing here moves dollars between accounts.
function updateScenarioAccountFunding(cid, accountId, val){
  const c = getClient(cid);
  const scenario = activeScenario(c);
  const acc = (scenario.extraAccounts||[]).find(a=>a.id===accountId);
  if(!acc) return;
  acc.fundingNote = val;
  renderTab();
}
// Removes a hypothetical account from this scenario, along with any
// proposed holdings tagged to it (confirming first if it has any), and
// clears any filter/copy-selection state that referenced it.
function removeScenarioAccount(cid, accountId){
  const c = getClient(cid);
  const scenario = activeScenario(c);
  const touched = scenarioTouchesAccount(scenario, accountId, c);
  if(touched && !confirm('This account has proposed holdings in this scenario — remove it and its holdings?')) return;
  scenario.holdings = (scenario.holdings||[]).filter(h=>h.accountId!==accountId);
  scenario.extraAccounts = (scenario.extraAccounts||[]).filter(a=>a.id!==accountId);
  if(scenario.activeAccountFilter===accountId) scenario.activeAccountFilter = '';
  if(scenario.copySelection) scenario.copySelection = scenario.copySelection.filter(id=>id!==accountId);
  renderAll();
}
// Toggles whether a real client account is excluded from this scenario —
// "this proposal isn't about the 401k" — without touching the client's
// actual account list. Excluding also clears any filter/copy-selection
// state pointed at it, so the UI doesn't keep showing a tab or checkbox for
// an account that's no longer part of this scenario's picture.
function toggleScenarioAccountExclusion(cid, accountId){
  const c = getClient(cid);
  const scenario = activeScenario(c);
  scenario.excludedAccountIds = scenario.excludedAccountIds || [];
  const idx = scenario.excludedAccountIds.indexOf(accountId);
  if(idx===-1){
    scenario.excludedAccountIds.push(accountId);
    if(scenario.activeAccountFilter===accountId) scenario.activeAccountFilter = '';
    if(scenario.copySelection) scenario.copySelection = scenario.copySelection.filter(id=>id!==accountId);
  } else {
    scenario.excludedAccountIds.splice(idx,1);
  }
  renderAll();
}

function addProposedHolding(cid, forceAccountId){
  const c = getClient(cid);
  const scenario = activeScenario(c);
  // New rows default to whichever account tab is currently selected, so
  // adding a holding while viewing "SEP IRA" tags it to that account rather
  // than landing in Unassigned and needing a manual re-tag. A grouped
  // "+ Add holding" button (per-account, in the "All accounts" view) passes
  // its own accountId explicitly instead, including '' for the Unassigned
  // group.
  const accountId = forceAccountId!==undefined ? forceAccountId : (scenario.activeAccountFilter || '');
  scenario.holdings.push({ticker:'', assetClass:'us_large', value:'', accountId});
  renderAll();
}
function removeProposedHolding(cid, idx){
  const c = getClient(cid);
  activeScenario(c).holdings.splice(idx,1);
  renderAll();
}
function updateProposedHolding(cid, idx, field, val){
  const c = getClient(cid);
  const holdings = activeScenario(c).holdings;
  const h = holdings[idx];
  if(field==='value'){
    // Clamp against the scenario's total portfolio value, if one is set, so
    // a single holding can't push the overall allocation past 100% —
    // previously, typing e.g. 70% for a holding just added that much new
    // money on top of whatever the other holdings already summed to,
    // rather than reallocating within the fixed total.
    const scenario = activeScenario(c);
    const total = scenarioTargetTotal(scenario, c);
    if(total > 0){
      const requested = parseFloat(val) || 0;
      const othersSum = holdings.reduce((s,hh,i)=> i===idx ? s : s+(parseFloat(hh.value)||0), 0);
      const maxAllowed = Math.max(0, total - othersSum);
      if(requested > maxAllowed){
        val = String(Math.round(maxAllowed));
        setTimeout(()=> alert(`That would put the portfolio over 100% allocated. Capped at $${maxAllowed.toLocaleString(undefined,{maximumFractionDigits:0})} — the most room left in the $${total.toLocaleString(undefined,{maximumFractionDigits:0})} total.`), 0);
      }
    }
  }
  h[field] = val;
  if(field==='ticker'){
    const sec = findSecurity(val);
    if(sec) h.assetClass = sec.assetClass;
    else if((val||'').trim().toUpperCase()==='CASH'){
      // "CASH" isn't a real security in the library, so the normal
      // ticker→assetClass lookup above never matches it — special-cased
      // here the same way "US Cash" in the dropdown already sets the
      // ticker to CASH, just in the other direction.
      h.ticker = 'CASH';
      h.assetClass = 'us_cash';
    }
  }
  if(field==='assetClass' && val==='us_cash'){
    h.ticker = 'CASH';
  }
  renderTab();
  renderClientList();
}
// Copies current holdings into the scenario for whichever accounts are
// checked under "Copy which accounts?" When every account is selected (the
// default, nothing unchecked) this replaces the scenario's holdings
// entirely, same as always — including clearing out any old untagged/
// Unassigned holdings from a scenario built before per-account tagging
// existed, exactly as this button always has. Only once the advisor
// deliberately narrows the selection (unchecks an account) does it switch to
// the more surgical mode: replace just the selected accounts' proposed
// holdings and leave every other account's, and Unassigned's, exactly as
// they are — so unchecking the 401k here has the same effect as never
// touching it (it stays untouched and mirrors in as unchanged — see
// effectiveProposedHoldings).
function copyCurrentToProposed(cid){
  const c = getClient(cid);
  if(!c || !c.accounts) return;
  const scenario = activeScenario(c);
  const realAccounts = scenarioRealAccounts(scenario, c);
  const allIds = realAccounts.map(a=>a.id);
  const selection = (scenario.copySelection && scenario.copySelection.length) ? scenario.copySelection.filter(id=>allIds.includes(id)) : allIds;
  const selectedAccounts = realAccounts.filter(a=>selection.includes(a.id));
  if(!selectedAccounts.length){ alert('Select at least one account to copy — see "Copy which accounts?" below.'); return; }
  const isFullCopy = selectedAccounts.length === realAccounts.length;
  const fresh = [];
  selectedAccounts.forEach(acc=> (acc.holdings||[]).forEach(h=> fresh.push({ticker:h.ticker, assetClass:h.assetClass, value:h.value, accountId:acc.id})));

  if(isFullCopy){
    if(scenario.holdings.length && !confirm(`This replaces the ${scenario.holdings.length} holding(s) already in this scenario with a fresh copy of current holdings. Continue?`)) return;
    scenario.holdings = fresh;
  } else {
    const existingCount = selectedAccounts.reduce((s,acc)=> s + holdingsForAccount(scenario, acc.id, c).length, 0);
    const names = selectedAccounts.map(a=>a.name).join(', ');
    if(existingCount && !confirm(`This replaces the proposed holdings already modeled for ${names} with a fresh copy of their current holdings. Accounts not selected are not affected. Continue?`)) return;
    const kept = (scenario.holdings||[]).filter(h=>!selectedAccounts.some(a=>a.id===accountKeyFor(h,c,scenario)));
    scenario.holdings = [...kept, ...fresh];
  }
  renderAll();
}
function toggleCopySelection(cid, accountId){
  const c = getClient(cid);
  const scenario = activeScenario(c);
  const realIds = scenarioRealAccounts(scenario, c).map(a=>a.id);
  if(!scenario.copySelection || !scenario.copySelection.length) scenario.copySelection = realIds.slice();
  const i = scenario.copySelection.indexOf(accountId);
  if(i>-1) scenario.copySelection.splice(i,1); else scenario.copySelection.push(accountId);
  renderAll();
}
// Refreshes just ONE account's proposed holdings from its current holdings,
// leaving every other account's (and Unassigned's) proposed holdings exactly
// as they are — this is what lets an advisor model changes to, say, the SEP
// IRA while leaving the 401k proposal untouched, instead of the "Copy
// current portfolio" button above always pulling in and overwriting every
// account at once.
function copyAccountToProposed(cid, accountId){
  const c = getClient(cid);
  if(!c || !c.accounts) return;
  const acc = c.accounts.find(a=>a.id===accountId);
  if(!acc) return;
  const scenario = activeScenario(c);
  const existingCount = holdingsForAccount(scenario, accountId, c).length;
  if(existingCount && !confirm(`This replaces the ${existingCount} proposed holding(s) already modeled for "${acc.name}" with a fresh copy of its current holdings. Other accounts in this scenario are not affected. Continue?`)) return;
  const kept = (scenario.holdings||[]).filter(h=>accountKeyFor(h,c,scenario)!==accountId);
  const fresh = (acc.holdings||[]).map(h=>({ticker:h.ticker, assetClass:h.assetClass, value:h.value, accountId}));
  scenario.holdings = [...kept, ...fresh];
  renderAll();
}
function setProposedAccountFilter(cid, accountId){
  const c = getClient(cid);
  activeScenario(c).activeAccountFilter = accountId;
  renderAll();
}
// Rows imported while a specific account tab is selected are tagged to that
// account, same as a manually-added row — otherwise a bulk import while
// modeling just the SEP IRA would silently land in Unassigned instead.
function proposedImportAccountId(scenario){
  const f = scenario.activeAccountFilter || '';
  return (f && f!==ACCOUNT_FILTER_UNASSIGNED) ? f : '';
}
// Bulk fix for the easy-to-make mistake above: a CSV/paste import (or a
// bunch of manually-added rows) that landed in Unassigned because a
// specific account tab wasn't active at the time. Re-tags every currently
// unassigned proposed holding to the chosen account in one action instead
// of clicking through each holding's dropdown individually.
function reassignUnassignedHoldings(cid, accountId){
  const c = getClient(cid);
  const scenario = activeScenario(c);
  if(!accountId) return;
  (scenario.holdings||[]).forEach(h=>{

  });
  renderAll();
}

// Entry point for the new toolbar button — unlike the Review History flow,
// this doesn't require a full risk assessment or an existing snapshot. It
// works off whatever data the client currently has, sparse or complete
// (buildClientPDF already renders "—" for anything missing, verified
// separately). A snapshot still gets created behind the scenes — that's
// what the Edge Function/webhook needs to know which record to update when
// the signature comes back — but the button itself makes no assumptions
// about what's been filled in first.
async function sendClientForSignature(cid){
  const c = getClient(cid);
  if(!c) return;
  if(!c._remoteId){
    alert('This client hasn\'t been saved yet — click Save first, then try again (the server needs a saved record to attach the signature request to).');
    return;
  }
  const email = (c.contact.email || '').split(',')[0].trim();
  if(!email){
    alert('This client has no email address on file (Contact & Other Professionals section) — add one before sending for signature.');
    return;
  }
  // Reuse the most recent snapshot instead of always creating a new one, if
  // it was saved moments ago and hasn't been sent or signed yet. Without
  // this, clicking "Save snapshot of this review" and then "Send to Client
  // for Signature" — which already saves its own snapshot internally —
  // produced two near-identical entries in Review History for what the
  // advisor considered one single review.
  const last = c.reviewHistory[c.reviewHistory.length - 1];
  const RECENT_MS = 10 * 60 * 1000; // 10 minutes
  const lastIsFreshAndUnsigned = last && last.signatureStatus === 'unsigned' && (Date.now() - new Date(last.savedAt).getTime()) < RECENT_MS;
  let newIdx;
  if(lastIsFreshAndUnsigned){
    newIdx = c.reviewHistory.length - 1;
  } else {
    saveReviewSnapshot(cid); // pushes a new entry; renderTab() inside it will refresh the view
    newIdx = c.reviewHistory.length - 1;
  }
  await sendForESignature(cid, newIdx, `topEsignBtn-${cid}`);
}

function saveReviewSnapshot(cid){
  const c = getClient(cid);
  c.reviewHistory.push({
    savedAt: new Date().toISOString(),
    capacity: riskCapacityScore(c),
    preference: riskPreferenceScore(c),
    currentScore: portfolioScore(c),
    portfolioValue: portfolioValue(c),
    // Signature tracking: 'unsigned' until the advisor either sends it for
    // e-signature or uploads a scanned wet-signed copy. Two independent
    // paths, one status field — a review is either signed or it isn't,
    // regardless of which method got it there.
    signatureStatus: 'unsigned',
    signedDate: null,
    signedFileName: null,
    signedFileData: null,
    signedFilePath: null
  });

  // Auto-log this review into the running Notes & Actions history — saving
  // a review snapshot is the one deliberate action that populates both
  // places, rather than requiring the agenda/notes/recommendations to be
  // separately re-typed into the log by hand. Dated by the meeting date if
  // one was entered, otherwise today.
  const logDate = c.reviewDate ? new Date(c.reviewDate+'T00:00:00').toISOString() : new Date().toISOString();
  const noteParts = [];
  if(c.agenda) noteParts.push(`Agenda: ${c.agenda}`);
  if(c.personalChanges) noteParts.push(`Personal changes: ${c.personalChanges}`);
  if(c.notes) noteParts.push(c.notes);
  if(noteParts.length){
    c.noteLog.push({id: uid('log'), date: logDate, text: noteParts.join(' — ')});
  }
  if(c.recommendations){
    c.recommendationLog.push({id: uid('log'), date: logDate, text: c.recommendations});
  }

  renderTab();
}
function removeReviewSnapshot(cid, idx){
  const c = getClient(cid);
  c.reviewHistory.splice(idx,1);
  renderTab();
}
// Uploads the scanned wet-signed file to Supabase Storage via the
// signwell-sign Edge Function (service role) — the bucket is private with
// no client-facing policies, so this is the only path in or out of it.
// Replaces the old client-side-only base64 storage.
async function uploadSignedCopy(cid, idx, inputEl){
  const file = inputEl.files && inputEl.files[0];
  if(!file) return;
  const MAX_BYTES = 4 * 1024 * 1024; // 4MB — a scanned single-page PDF fits comfortably under this
  if(file.size > MAX_BYTES){
    alert('That file is ' + (file.size/1024/1024).toFixed(1) + 'MB — please keep signed copies under 4MB (a lower-resolution scan or a re-exported PDF usually does it).');
    inputEl.value = '';
    return;
  }
  const c = getClient(cid);
  if(!c._remoteId){
    alert('This client hasn\'t been saved yet — click Save first, then try uploading the signed copy again.');
    inputEl.value = '';
    return;
  }
  const reader = new FileReader();
  reader.onload = async () => {
    try{
      const session = await ensureValidSession();
      if(!session) throw new Error('Not signed in');
      const res = await fetch(EDGE_FUNCTION_URL, {
        method: 'POST',
        headers: { 'Authorization': 'Bearer ' + session.access_token, 'Content-Type': 'application/json' },
        body: JSON.stringify({
          action: 'uploadWetSigned',
          clientId: c._remoteId,
          reviewIndex: idx,
          fileBase64: reader.result,
          fileName: file.name,
          contentType: file.type || 'application/pdf'
        })
      });
      const data = await res.json();
      if(!res.ok) throw new Error(data.error || 'Unknown error uploading signed copy');

      c.reviewHistory[idx].signatureStatus = 'wet-signed';
      c.reviewHistory[idx].signedDate = data.signedDate;
      c.reviewHistory[idx].signedFileName = file.name;
      c.reviewHistory[idx].signedFilePath = data.path;
      c.reviewHistory[idx].signedFileData = null;
      renderTab();
    } catch(e){
      alert('Could not upload signed copy: ' + e.message);
    }
  };
  reader.onerror = () => alert('Could not read that file — please try again.');
  reader.readAsDataURL(file);
}
// Requests a short-lived signed URL from the Edge Function rather than
// touching Storage directly — the bucket has no client-facing policies, so
// this is the only way to retrieve a file from it. Falls back to the old
// embedded base64 for any review signed before this Storage migration and
// not yet backfilled.
async function downloadSignedCopy(cid, idx){
  const c = getClient(cid);
  const snap = c.reviewHistory[idx];
  if(!snap) return;
  if(!snap.signedFilePath && snap.signedFileData){
    const a = document.createElement('a');
    a.href = snap.signedFileData;
    a.download = snap.signedFileName || 'signed-review.pdf';
    a.click();
    return;
  }
  if(!snap.signedFilePath) return;
  if(!c._remoteId){ alert('This client record has no saved id — try reloading.'); return; }
  try{
    const session = await ensureValidSession();
    if(!session) throw new Error('Not signed in');
    const res = await fetch(EDGE_FUNCTION_URL, {
      method: 'POST',
      headers: { 'Authorization': 'Bearer ' + session.access_token, 'Content-Type': 'application/json' },
      body: JSON.stringify({ action: 'getDownloadUrl', clientId: c._remoteId, reviewIndex: idx })
    });
    const data = await res.json();
    if(!res.ok) throw new Error(data.error || 'Unknown error getting download link');
    window.open(data.url, '_blank');
  } catch(e){
    alert('Could not download signed copy: ' + e.message);
  }
}

// One-click e-signature send. Generates the review PDF entirely in-browser —
// no print dialog, no manual file selection — then uploads it to SignWell.
//
// Root-caused 2026-09-18: the version of this function that shipped for a
// while called html2canvas via html2pdf.js's own wrapper —
// `html2pdf().from(container).set({html2canvas:{...}}).toCanvas()` — instead
// of calling html2canvas directly. That wrapper does its own internal
// element-bounds bookkeeping (for its built-in, since-bypassed pagination),
// and it was feeding html2canvas the WRONG box for our container: verified
// directly by logging html2canvas's own render dimensions, the wrapper had
// it capturing at an offset roughly a quarter of the way into the container
// and at close to DOUBLE the container's true rendered height. That's what
// was producing the signed documents with content sheared off on one edge
// and long dead-blank stretches between sections — the manual page-slicing
// math below was correct all along, it was just slicing a corrupted canvas.
// Calling `html2canvas(container, {...})` directly (same options, same
// html2canvas version html2pdf.js 0.10.3 bundles — 1.4.1, loaded separately
// in <head>) reports the container's real, correct box every time. Confirmed
// by rendering full multi-page reports from both code paths and diffing
// every page, not just spot-checking.
//
// Second, separate bug found in the same pass: even with a correct canvas,
// fixed-height slicing has no idea what it's cutting through. Verified by
// extracting the raw slice canvases either side of a page boundary directly
// — a labeled field's label landed on one page and its bare value, with no
// label, landed alone at the top of the next. Nothing was actually
// duplicated; a row was just split in half, which reads exactly like a
// rendering error. The noSplitBlocks/nearestSafeBreak logic below fixes
// this the same way real print pagination does — by refusing to let a page
// boundary fall inside a field, a table row, a chart, or right after a
// heading with nothing under it.
// Shared renderer behind BOTH "Download PDF" and "Send for E-Signature" —
// unified 2026-09-18. Previously the download button used the browser's
// native window.print() path (CSS @media print + page-break-inside:avoid),
// which is a completely separate, never-actually-fixed pipeline: it has no
// border/footer treatment at all and the blank-space pagination bug (verified
// against a real client's downloaded PDF, "Von Gierke Jens") was still
// present there even after the e-signature pipeline below was fixed, because
// page-break-inside:avoid is real-browser-print-only CSS that html2canvas
// (used here) never looks at, and native print pagination has its own,
// independent bugs that were never addressed. Rather than debug two
// pagination engines, both download paths now go through this one, already
// verified-correct renderer, parameterized by the footer title text that
// differs between the annual review and the comparison report.
async function renderHtmlToPdfBlob(html, opts){
  opts = opts || {};
  const footerTitle = opts.footerTitle || '';
  const overlayText = opts.overlayText || 'Preparing document…';
  const container = document.createElement('div');
  // Must be a normal, in-flow element with no position:fixed/absolute and no
  // opacity/off-screen tricks — confirmed directly (twice now) that anything
  // other than plain in-flow positioning makes html2canvas measure it as
  // zero height, producing a blank, ~3KB PDF with no visible error. A
  // temporary full-screen overlay covers it visually so nothing looks broken
  // while it's briefly in the page.
  const overlay = document.createElement('div');
  overlay.id = 'pdfGenOverlay';
  overlay.style.cssText = 'position:fixed; inset:0; background:#f6f7fa; z-index:99999; display:flex; align-items:center; justify-content:center; font-family:inherit; font-size:15px; color:var(--ink-dim);';
  overlay.textContent = overlayText;
  document.body.appendChild(overlay);

  // font-family explicitly overridden here (not inherited from body's
  // -apple-system stack) — html2canvas has a known bug where it paints
  // -apple-system text using the real system font but measures glyph widths
  // against a mismatched fallback, causing words to overlap/collapse
  // together exactly as seen in the disclosures section. Arial/Helvetica are
  // metrics html2canvas handles correctly.
  container.style.cssText = 'width:800px; padding:0 28px; background:#fff; font-family:Arial,Helvetica,sans-serif;';
  container.innerHTML = html;
  document.body.appendChild(container);
  // Two animation frames ensures layout (including the SVG charts) has
  // genuinely finished before capture — same reasoning as the print timing
  // fix elsewhere in this tool.
  await new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r)));

  // html2canvas does not reliably honor width="100%" on inline <svg>
  // elements — it falls back to treating the viewBox/attribute numbers as
  // the true pixel width instead of the CSS-stretched size a real browser
  // computes. That's why these charts render full-width on screen but stay
  // stuck at their small design width (640/760px) in the captured PDF. Fix:
  // right before capture, read each SVG's actual on-screen rendered width
  // (already correctly computed by real browser layout at this point) and
  // bake it in as an explicit width/height attribute so html2canvas has no
  // percentage to misinterpret.
  container.querySelectorAll('svg').forEach(svg => {
    const rect = svg.getBoundingClientRect();
    const viewBox = svg.getAttribute('viewBox');
    if (!viewBox || rect.width <= 0) return;
    const parts = viewBox.split(/\s+/).map(Number);
    const vbW = parts[2], vbH = parts[3];
    if (!vbW || !vbH) return;
    svg.setAttribute('width', String(rect.width));
    svg.setAttribute('height', String(rect.width * (vbH / vbW)));
  });

  // Fixed-height pagination (below) cuts wherever a page happens to end,
  // with no awareness of what's on the page — so it was free to slice
  // straight through a labeled field (label on one page, its value stranded
  // alone on the next with no label), through a table row, through a chart.
  // The browser's own print pipeline avoids this via page-break-inside:avoid
  // in the print CSS, but that CSS is meaningless to html2canvas — it just
  // paints one flat image, it doesn't paginate. To get the same effect here,
  // record the on-screen (pre-capture) pixel range of every element that
  // must never be split, in the same container-relative coordinate space
  // the captured canvas uses (scaled by the same factor as html2canvas's
  // `scale` option below), then use those ranges to nudge each page break
  // to the nearest safe gap instead of wherever the raw height lands.
  const CAPTURE_SCALE = 3;
  const containerTop = container.getBoundingClientRect().top;
  const noSplitSelector = '.pdf-field, tr, .pdf-notes, .pdf-scores, .pdf-sig-row, svg, h3, .pdf-table, .pdf-title, .pdf-mini-label';
  // Headings glued forward so they never land alone at a page bottom: not
  // just <h3> section headers, but .pdf-title (e.g. "10-Year Projection —
  // {name}") and .pdf-mini-label (e.g. "Current Portfolio" / "Proposed
  // Portfolio" immediately above a chart) — verified missing before: a
  // "Current Portfolio" label was stranding itself at the bottom of a page
  // while its chart started fresh on the next one, with nothing wrong with
  // either element individually. Glue distance is generous (140px) for these
  // two since what follows is usually a full chart, not a single table row.
  const glueForwardSelector = 'h3, .pdf-title, .pdf-mini-label';
  const noSplitRanges = Array.from(container.querySelectorAll(noSplitSelector)).map(el => {
    const r = el.getBoundingClientRect();
    let top = (r.top - containerTop) * CAPTURE_SCALE;
    let bottom = (r.bottom - containerTop) * CAPTURE_SCALE;
    if (el.matches(glueForwardSelector)) bottom += 140 * (CAPTURE_SCALE / 3);
    return [top, bottom];
  }).filter(([top, bottom]) => bottom > top).sort((a, b) => a[0] - b[0]);

  // Cover page (.pdf-cover, if present) always gets its own page, whatever
  // its actual rendered height — recorded here, while the element is still
  // in the DOM and measurable, as a mandatory break point the planning pass
  // below must cut at rather than folding into normal fixed-height slicing.
  const hardBreaksAfter = Array.from(container.querySelectorAll('.pdf-cover')).map(el => {
    const r = el.getBoundingClientRect();
    return (r.bottom - containerTop) * CAPTURE_SCALE;
  }).sort((a, b) => a - b);

  // .pdf-page-break was already sprinkled through buildClientPDF/
  // buildComparisonPDF's markup as a page-break-before:always CSS hook —
  // meaningful only to native browser print (see the CSS rule at the top of
  // this file) and completely inert here, since html2canvas doesn't consult
  // print CSS at all. That's the real cause of "asset allocation runs into
  // trade list" — those two sections already carried this class, asking for
  // exactly the separation being requested, but nothing was ever reading it.
  // Wired up for real here: the top of every .pdf-page-break element becomes
  // a mandatory break point, same mechanism as the cover's hard break above,
  // just before the element instead of after it.
  const hardBreaksBefore = Array.from(container.querySelectorAll('.pdf-page-break')).map(el => {
    const r = el.getBoundingClientRect();
    return (r.top - containerTop) * CAPTURE_SCALE;
  }).sort((a, b) => a - b);
  const mandatoryBreaks = [...hardBreaksAfter, ...hardBreaksBefore].sort((a, b) => a - b);
  // Merge overlapping/adjacent ranges (e.g. a <tr> inside a <table>, or a
  // heading whose glued extension reaches into the next element) into flat
  // non-overlapping blocks so the page-break search below is a single pass.
  const noSplitBlocks = [];
  for (const [top, bottom] of noSplitRanges) {
    const last = noSplitBlocks[noSplitBlocks.length - 1];
    if (last && top <= last[1]) last[1] = Math.max(last[1], bottom);
    else noSplitBlocks.push([top, bottom]);
  }
  // Given a tentative page-end pixel, pull it back to the start of whatever
  // unsplittable block it would otherwise cut through. If that block is
  // taller than a full page on its own (a very long table with no safe
  // internal break) there is no safe earlier cut, so it's left in place
  // rather than looping forever or producing a zero-height page.
  //
  // One exception: if the block's bottom is only a hair past the tentative
  // end (a few px, well inside the footer band's own buffer), retreating to
  // the block's TOP wastes an entire block's worth of trailing space on this
  // page — plus glue overhead — to save a handful of pixels of overflow that
  // wouldn't even be visible. Confirmed happening in practice: a chart's
  // "Current"/"Proposed" label carries a 140px forward-glue window so it
  // never gets separated from the chart under it, and that window occasionally
  // lands its far edge a few pixels beyond a page's normal height — which,
  // before this, evicted the label AND its entire chart to a fresh page,
  // leaving both the tail of the page before it and the top of the page
  // after it mostly blank for no real reason. Extending forward instead, up
  // to a small tolerance, keeps that content where it visually belongs.
  //
  // Defaults to 0 (old, exact behavior) and is only opted into via
  // opts.forwardSnapTolerancePx — the Annual Review PDF must stay
  // byte-for-byte identical since it's the only document sent to SignWell
  // for the client's e-signature, so this must never shift so much as a
  // single pixel of its output. Only the Portfolio Change Proposal path
  // opts in.
  const FORWARD_SNAP_TOLERANCE_PX = opts.forwardSnapTolerancePx || 0;
  function nearestSafeBreak(pageStartPx, tentativeEndPx){
    for (const [top, bottom] of noSplitBlocks) {
      if (top < tentativeEndPx && bottom > tentativeEndPx) {
        if (bottom - tentativeEndPx <= FORWARD_SNAP_TOLERANCE_PX) return bottom;
        return top > pageStartPx ? top : tentativeEndPx;
      }
    }
    return tentativeEndPx;
  }

  // scale:3 triples the capture resolution relative to the container's raw
  // CSS pixel width (800px) — after being stretched to fill an 8.5in page,
  // this works out to roughly 280 DPI, comfortably above what's needed for
  // crisp text and thin chart lines. Bumped up from 2x after review showed
  // 2x was still visibly soft. letterRendering:true forces html2canvas to
  // draw each glyph individually rather than as a batched text run, which
  // measurably sharpens small font sizes at a modest speed cost.
  //
  // Called directly (not through html2pdf().from().toCanvas()) — see the
  // comment above this function for why that wrapper is not used here.
  const canvas = await html2canvas(container, {scale:3, useCORS:true, letterRendering:true});
  document.body.removeChild(container);
  document.body.removeChild(overlay);

  const { jsPDF } = window.jspdf;
  const pdf = new jsPDF({unit:'in', format:'letter', orientation:'portrait'});
  const pageWidthIn = 8.5, pageHeightIn = 11;
  const marginIn = 0.45;
  // Footer band reserved below the content margin for the border's bottom
  // edge, the page number, and the firm name — keeps the border and footer
  // text from ever competing with report content for the same inch of page.
  const footerIn = 0.22;
  const usableWidthIn = pageWidthIn - marginIn*2;
  const usableHeightIn = pageHeightIn - marginIn*2 - footerIn;
  const pxPerIn = canvas.width / usableWidthIn;
  const pageHeightPx = usableHeightIn * pxPerIn;

  // Planning pass: walk the full canvas height computing where each page
  // would naively end, then pull that boundary back to nearestSafeBreak()
  // whenever it would land inside a protected element. Doing this as its
  // own pass (rather than inline in the render loop) means the page count
  // — needed for "Page X of Y" in the footer — is known up front, and each
  // page's true height is settled before any slicing/JPEG work happens.
  const pageRanges = [];
  {
    let start = 0;
    while(start < canvas.height){
      let naiveEnd = Math.min(start + pageHeightPx, canvas.height);
      // A mandatory break (the bottom of the cover page, or the top of any
      // .pdf-page-break section) always wins over the normal fixed-height
      // calculation, as long as it still fits within one page's height from
      // this page's start — otherwise (an unexpectedly tall section) fall
      // through to ordinary slicing rather than emit a page taller than the
      // printable area.
      const hardBreak = mandatoryBreaks.find(hb => hb > start && hb <= naiveEnd);
      if (hardBreak !== undefined) naiveEnd = hardBreak;
      // A hard break is always the exact top edge of a whole element (a
      // .pdf-page-break section, or the bottom of the cover), so cutting
      // there can never split anything mid-element — it's already safe by
      // construction. Do NOT also run nearestSafeBreak() on it: that search
      // only knows the raw pixel ranges of protected elements/glue windows,
      // not that this particular pixel is a deliberate content boundary, so
      // it was liable to find some earlier glued element (e.g. a chart
      // label's 140px forward-glue reaching right up to the hard break) and
      // yank the page-end back before content that actually had room to
      // fit — stranding it, and a chunk of blank space, on the next page
      // for no reason. Only run the safety search when this page's end is
      // still the ordinary fixed-height guess, never when it's a hard break.
      const end = (hardBreak !== undefined || naiveEnd >= canvas.height) ? naiveEnd : nearestSafeBreak(start, naiveEnd);
      pageRanges.push([start, end]);
      start = end;
    }
  }
  const totalPages = pageRanges.length;

  // Professional page frame: a thin rule box around the full margin area
  // (so the report reads as a bound document rather than a loose printout),
  // plus a firm name + "Page X of Y" footer repeated on every page. Drawn
  // with jsPDF's own vector primitives directly onto each page — not part
  // of the captured canvas — so it stays crisp at any zoom and costs nothing
  // in file size.
  // Cover page (page 0, when the document has one) keeps the frame border
  // for a consistent bound-document edge, but skips the running
  // firm/title/page-number footer line — a title page reads as a title
  // page, not as "page 1 of N" of the report proper.
  const hasCover = hardBreaksAfter.length > 0;
  function drawPageFrame(pageIndex){
    pdf.setDrawColor(0, 35, 71); // --navy
    pdf.setLineWidth(0.012);
    pdf.rect(marginIn - 0.14, marginIn - 0.14, pageWidthIn - (marginIn - 0.14)*2, pageHeightIn - (marginIn - 0.14)*2);
    if (hasCover && pageIndex === 0) return;
    pdf.setDrawColor(226, 230, 238); // --line
    pdf.setLineWidth(0.006);
    pdf.line(marginIn - 0.14, pageHeightIn - marginIn + footerIn - 0.1, pageWidthIn - marginIn + 0.14, pageHeightIn - marginIn + footerIn - 0.1);
    pdf.setFont('helvetica', 'normal');
    pdf.setFontSize(7.5);
    pdf.setTextColor(120, 130, 148);
    pdf.text('Redmount Capital Partners LLC', marginIn - 0.14, pageHeightIn - marginIn + footerIn + 0.04);
    pdf.text(footerTitle, pageWidthIn / 2, pageHeightIn - marginIn + footerIn + 0.04, {align:'center'});
    pdf.text(`Page ${pageIndex + 1} of ${totalPages}`, pageWidthIn - marginIn + 0.14, pageHeightIn - marginIn + footerIn + 0.04, {align:'right'});
  }

  pageRanges.forEach(([start, end], pageNum) => {
    const sliceHeightPx = end - start;
    const sliceCanvas = document.createElement('canvas');
    sliceCanvas.width = canvas.width;
    sliceCanvas.height = sliceHeightPx;
    sliceCanvas.getContext('2d').drawImage(canvas, 0, start, canvas.width, sliceHeightPx, 0, 0, canvas.width, sliceHeightPx);

    if(pageNum > 0) pdf.addPage();
    // JPEG at 0.92 quality instead of PNG — this is a text/line-art-heavy
    // document, not photography, so the quality loss is not visible, and it
    // cuts file size by roughly 10x (an uncompressed PNG of a full-page
    // canvas easily runs 2MB+ per page, well past what email or SignWell's
    // upload size comfortably handles for a multi-page document).
    pdf.addImage(sliceCanvas.toDataURL('image/jpeg', 0.92), 'JPEG', marginIn, marginIn, usableWidthIn, sliceHeightPx / pxPerIn);
    drawPageFrame(pageNum);
  });
  return pdf.output('blob');
}

async function generateClientPdfBlob(c){
  const clientName = [c.client1.first, c.client1.last].filter(Boolean).join(' ') || 'Client';
  return renderHtmlToPdfBlob(buildClientPDF(c), {
    footerTitle: `Annual Client Review — ${clientName}`,
    overlayText: 'Preparing document for signature…'
  });
}

async function sendForESignature(cid, idx, buttonId){
  const c = getClient(cid);
  if(!c) return;
  if(!c._remoteId){
    alert('This client hasn\'t been saved yet — click Save first, then try sending for e-signature again (the server needs a saved record to attach the signature request to).');
    return;
  }
  const email = (c.contact.email || '').split(',')[0].trim();
  if(!email){
    alert('This client has no email address on file (Contact & Other Professionals section) — add one before sending for e-signature.');
    return;
  }
  const signerName = [c.client1.first, c.client1.last].filter(Boolean).join(' ') || email;
  const btn = document.getElementById(buttonId || `esign-btn-${cid}-${idx}`);
  const originalBtnText = btn ? btn.textContent : '';
  if(btn){ btn.disabled = true; btn.textContent = 'Preparing document…'; }

  try{
    const pdfBlob = await generateClientPdfBlob(c);
    if(btn) btn.textContent = 'Sending…';

    const reader = new FileReader();
    const pdfBase64 = await new Promise((resolve, reject) => {
      reader.onload = () => resolve(reader.result.split(',')[1]);
      reader.onerror = reject;
      reader.readAsDataURL(pdfBlob);
    });

    const session = await ensureValidSession();
    if(!session) throw new Error('Not signed in');

    const res = await fetch(EDGE_FUNCTION_URL, {
      method: 'POST',
      headers: {
        'Authorization': 'Bearer ' + session.access_token,
        'Content-Type': 'application/json'
      },
      body: JSON.stringify({
        clientId: c._remoteId,
        reviewIndex: idx,
        signerEmail: email,
        signerName: signerName,
        pdfBase64: pdfBase64,
        title: `Annual Client Review — ${signerName}`
      })
    });
    const data = await res.json();
    if(!res.ok){
      throw new Error(data.error ? (data.error + (data.detail ? ': '+JSON.stringify(data.detail) : '')) : 'Unknown error sending for signature');
    }

    c.reviewHistory[idx].signatureStatus = 'sent';
    // renderTab() alone only refreshes the tab content area — the toolbar
    // button that triggered this (when called from the top-level "Send to
    // Client for Signature" button) lives outside that area, in the client
    // header, so it never got told the send actually finished and stayed
    // stuck on "Sending…" even though the request succeeded. renderAll()
    // refreshes both.
    renderAll();
  } catch(e){
    alert('Could not send for e-signature: ' + e.message);
    if(btn){ btn.disabled = false; btn.textContent = originalBtnText || 'Send for E-Signature'; }
  }
}

function updateCMA(key, field, val){
  CMA[key][field] = parseFloat(val) || 0;

}

const INTAKE_BASE_URL = 'https://redmountcurtis.github.io/risk-intake/';

function clientLinkTabHTML(c){
  if(!c._remoteId){
    return `<div class="panel">
      <h2>Client-Facing Intake Link</h2>
      <div class="note">This client hasn't finished saving to the database yet — give it a few seconds and reopen this tab. Links can only be generated for saved clients.</div>
    </div>`;
  }
  return `
  <div class="panel">
    <h2>Client-Facing Intake Link</h2>
    <p class="desc">Generate a link the client can open themselves on their phone or computer to answer the risk questionnaire. Their answers land in <strong>Pending Submissions</strong> for you to review — nothing merges into their record automatically.</p>
    <button class="btn" onclick="generateIntakeLink('${c.id}')">Generate new link</button>
    <div id="intakeLinkResult" style="margin-top:14px;"></div>
    <div class="divider"></div>
    <div class="step-label">Links sent for this client</div>
    <div id="existingLinksWrap"><div class="empty">Loading…</div></div>
  </div>`;
}

async function generateIntakeLink(cid){
  const c = getClient(cid);
  const resultEl = document.getElementById('intakeLinkResult');
  if(!c._remoteId){ if(resultEl) resultEl.innerHTML = '<div class="empty">Save this client first.</div>'; return; }
  resultEl.innerHTML = '<div class="empty">Generating…</div>';
  try{
    const firstName = c.client1.first || '';
    const lastName = c.client1.last || '';
    const age = c.age || null;
    const res = await supabaseFetch('/risk_intake_links', {
      method:'POST',
      headers:{'Prefer':'return=representation'},
      body: JSON.stringify({client_id: c._remoteId, client_first_name: firstName, client_last_name: lastName, client_age: age})
    });
    const data = await res.json();
    const link = data[0];
    const url = INTAKE_BASE_URL + '?token=' + link.token;
    resultEl.innerHTML = `
      <div class="note" style="background:var(--good-bg); border-color:#bfe3d0; color:#0d4f34;">
        <strong>Link ready</strong> — expires ${new Date(link.expires_at).toLocaleDateString()}. Copy it and send it to the client yourself (email, text — whatever you'd normally use).
        <div style="display:flex; gap:8px; margin-top:10px;">
          <input type="text" readonly value="${attrEsc(url)}" style="flex:1; font-size:12px; padding:8px 10px;" onclick="this.select()">
          <button class="btn secondary" onclick="navigator.clipboard.writeText('${url}'); this.textContent='Copied!'">Copy</button>
        </div>
      </div>`;
    loadExistingLinks(c);
  }catch(e){
    console.error(e);
    resultEl.innerHTML = '<div class="note" style="background:var(--bad-bg); color:var(--bad);">Could not generate a link. Try again.</div>';
  }
}

async function loadExistingLinks(c){
  const wrap = document.getElementById('existingLinksWrap');
  if(!wrap || !c._remoteId) return;
  try{
    const res = await supabaseFetch(`/risk_intake_links?client_id=eq.${c._remoteId}&order=created_at.desc`);
    const links = await res.json();
    if(!links.length){ wrap.innerHTML = '<div class="empty">No links sent yet.</div>'; return; }
    wrap.innerHTML = `<table>
      <thead><tr><th>Sent</th><th>Expires</th><th>Status</th><th></th></tr></thead>
      <tbody>${links.map(l=>{
        const url = INTAKE_BASE_URL + '?token=' + l.token;
        const expired = new Date(l.expires_at) < new Date();
        const status = l.used_at ? 'Submitted' : expired ? 'Expired' : 'Waiting on client';
        const flagClass = l.used_at ? 'ok' : expired ? 'err' : 'warn';
        return `<tr>
          <td>${new Date(l.created_at).toLocaleDateString()}</td>
          <td>${new Date(l.expires_at).toLocaleDateString()}</td>
          <td><span class="flag ${flagClass}">${status}</span></td>
          <td style="white-space:nowrap;">
            <button class="btn ghost" onclick="navigator.clipboard.writeText('${url}'); this.textContent='Copied'">Copy link</button>
            <button class="btn danger" onclick="deleteIntakeLink('${l.token}','${c.id}')">Delete</button>
          </td>
        </tr>`;
      }).join('')}</tbody>
    </table>`;
  }catch(e){ console.error(e); wrap.innerHTML = '<div class="empty">Could not load links.</div>'; }
}

function mergeAnswersIntoClient(targetClient, answers){
  const a = answers || {};
  if(a.firstName && !targetClient.client1.first) targetClient.client1.first = a.firstName;
  if(a.lastName && !targetClient.client1.last) targetClient.client1.last = a.lastName;
  if(a.age) targetClient.age = a.age;
  if(a.investableAssets) targetClient.financial.investableAssets = a.investableAssets;
  ['lossReaction','historicalBehavior','maxLossTolerance','gainFlipChoice','lossFlipChoice','incomeStability','experienceLevel'].forEach(k=>{
    if(a[k]!==undefined && a[k]!=='') targetClient.questionnaire[k] = a[k];
  });
  if(a.goalDescription) targetClient.goal.description = a.goalDescription;
  if(a.goalTargetAmount) targetClient.goal.targetAmount = a.goalTargetAmount;
  if(a.goalYears) targetClient.goal.years = a.goalYears;
}

async function acceptSubmission(submissionId, selectId){
  try{
    const res = await supabaseFetch(`/risk_intake_submissions?id=eq.${submissionId}&select=*,risk_intake_links(client_id,client_first_name)`);
    const rows = await res.json();
    if(!rows.length) return;
    const sub = rows[0];
    const select = document.getElementById(selectId);
    const choice = select ? select.value : '__new__';

    let targetClient;
    if(choice === '__new__'){
      targetClient = blankClient();
      targetClient.activeScenarioId = targetClient.proposedScenarios[0].id;
      const firstName = (sub.risk_intake_links && sub.risk_intake_links.client_first_name) || '';
      if(firstName) targetClient.client1.first = firstName;
      clients.push(targetClient);
      activeId = targetClient.id;
    } else {
      targetClient = clients.find(c=>c.id === choice);
      if(!targetClient){ alert('Could not find that client — refresh and try again.'); return; }
    }

    mergeAnswersIntoClient(targetClient, sub.answers);

    await supabaseFetch(`/risk_intake_submissions?id=eq.${submissionId}`, {method:'PATCH', body: JSON.stringify({reviewed:true})});
    delete lastSavedHash[targetClient.id]; // force autosave to pick up the merge / new client
    reviewingSubmission = null;
    currentView = 'clients';
    activeId = targetClient.id;
    activeTab = 'profile';
    // Approving a submission is the same kind of "this review is complete"
    // moment as saving a snapshot manually or sending for signature — so it
    // gets the same auto-save, rather than requiring a separate manual
    // click right after affirming the client's answers. Called after
    // activeId/currentView/activeTab are set (not before) since this
    // internally re-renders the client tab, which doesn't exist in the DOM
    // yet while still on the Pending Submissions screen.
    saveReviewSnapshot(targetClient.id);
    renderAll();
  }catch(e){ console.error(e); alert('Could not accept this submission. Try again.'); }
}

async function rejectSubmission(submissionId){
  try{
    await supabaseFetch(`/risk_intake_submissions?id=eq.${submissionId}`, {method:'PATCH', body: JSON.stringify({reviewed:true})});
    reviewingSubmission = null;
    openPending();
  }catch(e){ console.error(e); }
}

function riskTabHTML(c){
  const cap = riskCapacityScore(c);
  const pref = riskPreferenceScore(c);
  const ps = portfolioScore(c);
  const pv = portfolioValue(c);
  const pp = proposedScore(c);
  const ppv = proposedValue(c);

  const currentHoldings = c.accounts.flatMap(a=>a.holdings);
  const proposedHoldings = effectiveProposedHoldings(c);
  const currentAlloc = allocationBreakdown(currentHoldings);
  const proposedAlloc = allocationBreakdown(proposedHoldings);

  const currentBand = inBand(ps, cap, pref);
  const proposedBand = inBand(pp, cap, pref);
  const hasBand = cap!==null && pref!==null;

  const currentLG = possibleLossGain(ps, pv);
  const proposedLG = possibleLossGain(pp, ppv);
  const currentExp = portfolioExpenseRatio(currentHoldings);
  const proposedExp = portfolioExpenseRatio(proposedHoldings);

  const currentAssump = portfolioAssumptions(currentAlloc);
  const proposedAssump = portfolioAssumptions(proposedAlloc);

  const currentSector = fieldBreakdown(currentHoldings, 'sector', 'Unclassified');
  const currentRegion = fieldBreakdown(currentHoldings, 'region', 'Unclassified');
  const proposedSector = fieldBreakdown(proposedHoldings, 'sector', 'Unclassified');
  const proposedRegion = fieldBreakdown(proposedHoldings, 'region', 'Unclassified');

  function miniAllocRow(alloc, label){
    if(!alloc.length) return '';
    return `<div style="text-align:center;">
      ${donutSVG(alloc, 100)}
      <div style="font-size:10px; color:var(--ink-dim); text-transform:uppercase; letter-spacing:.03em; margin-top:4px;">${label}</div>
    </div>`;
  }

  const rr = riskRequired(c);
  const requiredScore = rr && typeof rr.score === 'number' ? rr.score : null;
  let requiredNote = '';
  if(rr && rr.score === 'unattainable'){
    requiredNote = `<span class="gap-flag over">Goal not attainable at any sane return — revisit goal/timeline/savings</span>`;
  } else if(rr && rr.score === 'exceeds'){
    requiredNote = `<span class="gap-flag over">Required return (${rr.requiredReturn.toFixed(1)}%/yr) exceeds any modeled asset class</span>`;
  } else if(requiredScore!==null && cap!==null && pref!==null){
    const ceiling = Math.max(cap, pref);
    if(requiredScore > ceiling + 10){
      requiredNote = `<span class="gap-flag over">Required (${requiredScore}) is well above what the client is willing or able to take — goal, timeline, or savings rate needs a conversation</span>`;
    } else if(requiredScore < Math.min(cap, pref) - 15){
      requiredNote = `<span class="gap-flag aligned">Goal is achievable well within capacity/preference — could afford to be more conservative</span>`;

      requiredNote = `<span class="gap-flag aligned">Required risk is broadly consistent with capacity and preference</span>`;

  <div class="panel">

  <div class="panel">

    ${hasBand || ps!==null || pp!==null || requiredScore!==null ? riskBandSVG(cap, pref, ps, pp, requiredScore, {large:true}) : '<div class="empty">Complete the client profile risk questions and add holdings to see this.</div>'}
    <div style="display:flex; gap:8px; flex-wrap:wrap; margin-top:10px;">

      ${proposedBand!==null ? `<span class="gap-flag ${proposedBand?'aligned':'over'}">Proposed portfolio is ${proposedBand?'in band':'out of band'}</span>` : ''}
      ${requiredNote}

  <div class="row">
