<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Redmount Risk Modeling</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.3/html2pdf.bundle.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/4.2.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root{
    --navy:#002347; --navy-2:#01315f; --cobalt:#2f6fed; --cobalt-dim:#5b8bf0;
    --paper:#f6f7fa; --card:#ffffff; --line:#e2e6ee; --ink:#0e1a2b; --ink-dim:#5b6b82;
    --good:#177350; --good-bg:#e7f5ee; --warn:#8a5a00; --warn-bg:#fff3de;
    --bad:#9c2b2b; --bad-bg:#fbe9e9; --radius:10px;
  }
  *{box-sizing:border-box;}
  body{margin:0; font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif; background:var(--paper); color:var(--ink);}
  .shell{display:flex; min-height:100vh;}
  .sidebar{width:250px; flex-shrink:0; background:var(--navy); color:#cfe0ff; padding:22px 18px; display:flex; flex-direction:column; gap:20px; position:sticky; top:0; height:100vh; overflow-y:auto;}
  .brand{font-size:15px; font-weight:700; color:#fff;}
  .brand small{display:block; font-weight:400; color:#9fb8e6; font-size:11px; margin-top:2px;}
  .client-list{display:flex; flex-direction:column; gap:2px; overflow-y:auto;}
  .client-item{padding:9px 10px; border-radius:8px; cursor:pointer; font-size:13px; color:#b7c9e8; display:flex; justify-content:space-between; align-items:center; transition:background .12s, color .12s;}
  .client-item:hover{background:rgba(255,255,255,0.06);}
  .client-item:hover{color:#fff;}
  .client-item.active{background:var(--navy-2); color:#fff; font-weight:600;}
  .client-item .gapdot{width:8px; height:8px; border-radius:50%; flex-shrink:0;}
  .side-foot{margin-top:auto; font-size:11px; color:#7d92b8; line-height:1.5;}
  .tool-switcher-label{font-size:10px; text-transform:uppercase; letter-spacing:.06em; color:#7d92b8; font-weight:600; margin-bottom:6px;}
  .tool-switcher{width:100%; background:rgba(255,255,255,0.08); border:1px solid rgba(255,255,255,0.18); color:#fff; font-family:inherit; font-size:12.5px; padding:8px 9px; border-radius:6px;}
  .tool-switcher option{color:#111;}
  .nav-divider{height:1px; background:rgba(255,255,255,0.12); margin:4px 0;}
  .main{flex:1; padding:32px 40px; max-width:1180px;}
  h1{font-size:23px; margin:0 0 4px; font-weight:800; color:var(--navy); letter-spacing:-.015em;}
  .sub{color:var(--ink-dim); font-size:13.5px; margin:0 0 24px;}
  .panel{background:var(--card); border:1px solid var(--line); border-radius:14px; padding:24px 26px; margin-bottom:24px; box-shadow:0 1px 2px rgba(15,35,71,0.04), 0 4px 14px -8px rgba(15,35,71,0.10);}
  .panel h2{font-size:15.5px; margin:0 0 12px; padding-bottom:12px; font-weight:700; color:var(--navy); letter-spacing:-.01em; display:flex; align-items:center; gap:9px; border-bottom:1px solid #eef1f6;}
  .panel h2::before{content:''; width:4px; height:15px; background:var(--cobalt); border-radius:2px; flex-shrink:0;}
  .panel .desc{color:var(--ink-dim); font-size:12.5px; margin:-4px 0 16px; line-height:1.5;}
  .row{display:flex; gap:14px; flex-wrap:wrap;}
  .field{display:flex; flex-direction:column; gap:5px; margin-bottom:14px; flex:1; min-width:190px;}
  .field label{font-size:11px; font-weight:600; color:var(--ink-dim); text-transform:uppercase; letter-spacing:.04em;}
  input, select, textarea{border:1px solid var(--line); border-radius:8px; padding:8px 10px; font-size:13.5px; font-family:inherit; background:#fff; color:var(--ink); width:100%; transition:border-color .12s, box-shadow .12s;}
  input[type="radio"], input[type="checkbox"]{width:auto; border:none; padding:0; background:none; border-radius:0; accent-color:var(--cobalt); flex-shrink:0;}
  input:focus, select:focus, textarea:focus{outline:3px solid rgba(47,111,237,0.14); outline-offset:0; border-color:var(--cobalt);}
  .btn{background:var(--cobalt); color:#fff; border:none; border-radius:8px; padding:9px 16px; font-size:13px; font-weight:600; cursor:pointer; box-shadow:0 1px 2px rgba(47,111,237,0.25); transition:background .15s, box-shadow .15s, transform .08s;}
  .btn:hover{background:#2660d4; box-shadow:0 2px 8px rgba(47,111,237,0.32);}
  .btn:active{transform:translateY(1px);}
  .btn.secondary{background:#fff; color:var(--navy); border:1px solid var(--line); box-shadow:0 1px 2px rgba(15,35,71,0.04);}
  .btn.secondary:hover{background:#f0f3f8;}
  .btn.ghost{background:transparent; color:var(--ink-dim); border:1px solid var(--line); padding:6px 10px; font-size:12px; box-shadow:none;}
  .btn.ghost:hover{background:#f0f3f8; color:var(--navy);}
  .btn.danger{background:transparent; color:var(--bad); border:1px solid #efc6c6; padding:6px 10px; font-size:12px; box-shadow:none;}
  .btn.danger:hover{background:var(--bad-bg);}
  .btn:disabled{opacity:.5; cursor:not-allowed; box-shadow:none;}
  .tabs{display:flex; gap:2px; margin-bottom:22px; border-bottom:1.5px solid var(--line); overflow-x:auto;}
  .tab{padding:11px 18px; font-size:13px; font-weight:600; color:var(--ink-dim); cursor:pointer; border-bottom:2.5px solid transparent; border-radius:8px 8px 0 0; transition:background .15s, color .15s; white-space:nowrap;}
  .tab:hover{color:var(--navy); background:#f4f6fb;}
  .tab.active{color:var(--cobalt); border-color:var(--cobalt); background:#eef3fe;}
  .subtabs{display:flex; gap:6px; margin-bottom:16px; flex-wrap:wrap;}
  .subtab{padding:6px 14px; font-size:12.5px; font-weight:600; color:var(--ink-dim); cursor:pointer; background:#eef1f6; border-radius:99px; border:1px solid transparent; transition:background .15s, color .15s;}
  .subtab:hover{background:#e4e9f2;}
  .subtab.active{background:#eaf0fe; color:var(--cobalt); border-color:#c7d9fb;}
  .subhead{font-size:11.5px; font-weight:700; text-transform:uppercase; letter-spacing:.05em; color:var(--navy); margin:22px 0 12px; padding-bottom:7px; border-bottom:1px solid #eef1f6; display:flex; align-items:center; gap:7px;}
  .subhead::before{content:''; width:6px; height:6px; border-radius:50%; background:var(--cobalt-dim); flex-shrink:0;}
  .subhead:first-child{margin-top:0;}
  table{width:100%; border-collapse:collapse; font-size:13px;}
  th{text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:.03em; color:var(--ink-dim); border-bottom:1px solid var(--line); padding:8px 10px; font-weight:600;}
  td{padding:8px 10px; border-bottom:1px solid #eef1f6;}
  tr:last-child td{border-bottom:none;}
  .empty{border:1px dashed var(--line); border-radius:8px; padding:24px; text-align:center; color:var(--ink-dim); font-size:13px;}
  .filedrop{display:block; border:1.5px dashed var(--line); border-radius:8px; text-align:center; color:var(--ink-dim); font-size:12.5px; cursor:pointer; background:#fbfcfe; transition:border-color .15s, color .15s, background .15s;}
  .filedrop:hover, .filedrop.drag-over{border-color:var(--cobalt-dim); color:var(--cobalt); background:#f5f8ff;}
  .filedrop.drag-over{border-style:solid;}
  .holding-row{display:grid; grid-template-columns:1.4fr 1fr auto; gap:8px; margin-bottom:6px; align-items:center;}
  .holding-boxes{display:flex; flex-wrap:wrap; gap:10px; margin-bottom:12px;}
  .holding-box{position:relative; width:190px; border:1.5px solid var(--line); border-radius:12px; padding:12px 12px 10px; background:#fff; display:flex; flex-direction:column; gap:8px; transition:border-color .15s, box-shadow .15s; box-shadow:0 1px 2px rgba(15,35,71,0.03);}
  .holding-box:hover{border-color:var(--cobalt-dim); box-shadow:0 2px 8px -3px rgba(15,35,71,0.12);}
  .holding-box .hb-top{display:flex; align-items:center; gap:8px;}
  .holding-box .hb-ticker{flex:1; min-width:0; border:none; border-bottom:1.5px solid var(--line); font-size:15px; font-weight:700; text-transform:uppercase; padding:2px 0; background:transparent; color:var(--navy);}
  .holding-box .hb-ticker:focus{outline:none; border-color:var(--cobalt);}
  .holding-box .hb-remove{position:absolute; top:8px; right:8px; background:none; border:none; color:var(--ink-dim); cursor:pointer; font-size:16px; line-height:1; padding:2px;}
  .holding-box .hb-remove:hover{color:var(--bad);}
  .holding-box .hb-value-row{display:flex; align-items:center; gap:4px; border:1px solid var(--line); border-radius:8px; padding:6px 10px; background:#fbfcfe;}
  .holding-box .hb-value-row span{color:var(--ink-dim); font-weight:700; font-size:13px;}
  .holding-box .hb-value-row input{border:none; background:transparent; font-size:14px; font-weight:600; padding:0; width:100%; min-width:0;}
  .holding-box .hb-value-row input:focus{outline:none;}
  .holding-box select{font-size:11px; padding:5px 6px;}
  .holding-box .hb-meta{font-size:10px; color:var(--ink-dim);}
  .holding-box-add{width:190px; border:1.5px dashed var(--line); border-radius:12px; display:flex; align-items:center; justify-content:center; color:var(--ink-dim); cursor:pointer; font-size:13px; font-weight:600; min-height:150px; transition:border-color .15s, color .15s; text-align:center; padding:12px;}
  .holding-box-add:hover{border-color:var(--cobalt-dim); color:var(--cobalt); background:#f8fafe;}
  .gauge-wrap{display:flex; gap:26px; flex-wrap:wrap; align-items:flex-start;}
  .gauge{width:220px;}
  .gauge .num{font-size:38px; font-weight:800; color:var(--navy);}
  .gauge .lbl{font-size:11px; text-transform:uppercase; letter-spacing:.03em; color:var(--ink-dim); font-weight:600;}
  .bar-track{height:10px; background:#eef1f6; border-radius:99px; margin:8px 0; position:relative; overflow:hidden;}
  .bar-fill{height:100%; border-radius:99px; background:linear-gradient(90deg,#2f6fed,#7aa5f5);}
  .gap-flag{display:inline-block; margin-top:10px; padding:5px 12px; border-radius:99px; font-size:12px; font-weight:700;}
  .summary-cards{display:flex; gap:14px; margin-bottom:24px; flex-wrap:wrap;}
  .scard{flex:1; min-width:150px; background:var(--card); border:1px solid var(--line); border-radius:12px; padding:17px 18px 16px; box-shadow:0 1px 2px rgba(15,35,71,0.04), 0 3px 10px -6px rgba(15,35,71,0.10); position:relative; overflow:hidden;}
  .scard::before{content:''; position:absolute; top:0; left:0; right:0; height:3px; background:var(--cobalt-dim);}
  .scard.warn::before{background:var(--warn);}
  .scard.bad::before{background:var(--bad);}
  .scard.good::before{background:var(--good);}
  .scard .label{font-size:10.5px; text-transform:uppercase; color:var(--ink-dim); letter-spacing:.04em; font-weight:600;}
  .scard .value{font-size:26px; font-weight:800; margin-top:5px; color:var(--navy);}
  .scard.warn .value{color:var(--warn);}
  .scard.bad .value{color:var(--bad);}
  .scard.good .value{color:var(--good);}
  .gap-flag.aligned{background:var(--good-bg); color:var(--good);}
  .gap-flag.over{background:var(--bad-bg); color:var(--bad);}
  .gap-flag.under{background:var(--warn-bg); color:var(--warn);}
  .divider{height:1px; background:var(--line); margin:18px 0;}
  .step-label{display:inline-flex; align-items:center; gap:6px; font-size:11px; font-weight:700; color:var(--cobalt); text-transform:uppercase; letter-spacing:.04em; margin-bottom:6px;}
  .flag{padding:2px 9px; border-radius:6px; font-size:11px; font-weight:600; display:inline-block; background:#eef1f6; color:var(--ink-dim);}
  .flag.ok{background:var(--good-bg); color:var(--good);}
  .flag.err{background:var(--bad-bg); color:var(--bad);}
  .flag.warn{background:var(--warn-bg); color:var(--warn);}
  .compact{font-size:12.5px !important; padding:5px 8px !important;}
  .signout-link{color:#b7c9e8;}
  .signout-link:hover{color:#fff;}
  .note{background:var(--warn-bg); border:1px solid #f0dcaa; color:#6b4a00; border-radius:8px; padding:12px 14px; font-size:12.5px; line-height:1.5; margin-bottom:18px;}
  .note strong{color:#3d2c00;}
  .toolbar{display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; flex-wrap:wrap; gap:10px;}
  .account-card{border:1px solid var(--line); border-radius:8px; padding:14px 16px; margin-bottom:14px;}
  .account-card .acct-head{display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;}
  .account-card .acct-head input{font-weight:600; font-size:13.5px; border:none; padding:2px 0; max-width:260px;}
  .empty-state-btn{margin-top:6px;}
  footer.tool-foot{font-size:11.5px; color:var(--ink-dim); margin-top:6px; text-align:right;}

  /* ---------- Print / PDF layout ---------- */
  #printArea{display:none;}
  .pdf-letterhead{margin-bottom:18px; padding-bottom:14px; border-bottom:2px solid var(--navy);}
  .pdf-letterhead .firm{font-size:18px; font-weight:800; color:var(--navy); letter-spacing:.02em;}
  .pdf-letterhead .addr{font-size:11.5px; color:var(--ink-dim); margin-top:2px;}
  .pdf-title{font-size:15px; font-weight:700; color:var(--navy); margin:18px 0 2px;}
  .pdf-sub{font-size:11.5px; color:var(--ink-dim); margin-bottom:10px;}
  .pdf-section{margin-top:16px;}
  .pdf-section h3{font-size:11.5px; text-transform:uppercase; letter-spacing:.05em; color:#fff; background:var(--navy); padding:6px 10px; margin:0 0 10px; border-radius:5px; page-break-after:avoid; break-after:avoid;}
  .pdf-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:6px 18px; font-size:12px;}
  .pdf-grid.two{grid-template-columns:repeat(2,1fr);}
  .pdf-field{display:flex; flex-direction:column;}
  .pdf-field .l{font-size:9.5px; text-transform:uppercase; letter-spacing:.04em; color:var(--ink-dim);}
  .pdf-field .v{font-size:12px; color:var(--ink); border-bottom:1px solid #eee; padding:1px 0 3px; min-height:15px;}
  .pdf-table{width:100%; border-collapse:collapse; font-size:11.5px; margin-top:6px;}
  .pdf-table th{text-align:left; font-size:9.5px; text-transform:uppercase; color:var(--ink-dim); border-bottom:1px solid var(--line); padding:5px 6px;}
  .pdf-table td{padding:5px 6px; border-bottom:1px solid #f0f0f0;}
  .pdf-scores{display:flex; gap:30px; margin:10px 0;}
  .pdf-scores .s{text-align:center;}
  .pdf-scores .s .num{font-size:26px; font-weight:800; color:var(--navy);}
  .pdf-scores .s .lbl{font-size:9.5px; text-transform:uppercase; color:var(--ink-dim);}
  .pdf-sig-row{display:flex; gap:40px; margin-top:34px;}
  .pdf-page-break{page-break-before:always;}
  .pdf-sig{flex:1; border-top:1px solid #999; padding-top:5px; font-size:10.5px; color:var(--ink-dim);}
  .pdf-notes{font-size:12px; white-space:pre-wrap; border:1px solid var(--line); border-radius:4px; padding:8px; min-height:30px;}

  @media (max-width: 760px){
    .shell{flex-direction:column;}
    .sidebar{width:100%; flex-direction:row; flex-wrap:wrap; align-items:center; padding:14px 16px; gap:10px; position:static; height:auto; overflow-y:visible;}
    .sidebar .brand{width:100%;}
    .sidebar input, .sidebar select, .sidebar .btn{width:auto; flex:1; min-width:110px;}
    .client-list{width:100%; max-height:140px; overflow-y:auto; order:5;}
    .tool-switcher-label, .tool-switcher, .nav-divider, .side-foot{width:100%;}
    .main{padding:18px 16px;}
    .row{flex-direction:column;}
    .tabs{overflow-x:auto; flex-wrap:nowrap;}
    .tab{white-space:nowrap;}
    .mapping-grid{grid-template-columns:1fr;}
    table{font-size:12px;}
  }

  .authgate{position:fixed; inset:0; background:var(--paper); display:flex; align-items:center; justify-content:center; z-index:200; padding:24px;}
  .authcard{background:var(--card); border:1px solid var(--line); border-radius:var(--radius); width:100%; max-width:380px; padding:32px 32px 26px; box-shadow:0 8px 24px -12px rgba(0,35,71,0.18);}
  .authcard .auth-logo{font-size:15px; font-weight:800; color:var(--navy); letter-spacing:.02em; margin-bottom:6px;}
  .authcard h1{font-size:21px; margin:14px 0 4px; color:var(--navy);}
  .authcard p.sub{font-size:12.5px; color:var(--ink-dim); margin:0 0 22px;}
  .authcard label{display:block; font-size:11px; font-weight:600; text-transform:uppercase; letter-spacing:.05em; color:var(--ink-dim); margin:16px 0 5px;}
  .authcard input{width:100%; padding:10px 12px; border:1px solid var(--line); border-radius:6px; font-size:13.5px; font-family:inherit; box-sizing:border-box;}
  .authcard input:focus{outline:none; border-color:var(--cobalt);}
  .authcard button{width:100%; margin-top:20px; padding:11px; background:var(--cobalt); border:none; color:#fff; border-radius:6px; font-size:13px; font-weight:600; cursor:pointer;}
  .authcard button:disabled{opacity:.6; cursor:not-allowed;}
  .authcard .err{font-size:12.5px; color:var(--bad); margin-top:10px; display:none;}
  .authcard .err.show{display:block;}
  .sync-status{font-size:10.5px; color:#7d92b8; margin-top:4px; display:flex; align-items:center; gap:5px;}
  .sync-dot{width:6px; height:6px; border-radius:50%; background:#7d92b8; flex-shrink:0;}
  .sync-dot.saved{background:#3ecf8e;}
  .sync-dot.saving{background:#e0a83f;}
  .sync-dot.error{background:#e06767;}

  @media print{
    /* display:none (not visibility:hidden) is required here — visibility
       hides content but leaves its height in the layout, so whichever tab
       was open behind the print dialog was still contributing its full
       height to the printed page count even though it was invisible. That's
       what produced extra blank pages after the real report content — the
       print engine was still paginating through the hidden app's height.
       display:none removes it from layout entirely. Confirmed and fixed as
       the same root cause in the ECS tool's PDF pipeline earlier. */
    #authGate, #mainApp{display:none !important;}
    #printArea{display:block !important; position:static; width:100%; padding:20px;}
    @page{margin:0.6in;}
  }
</style>
</head>
<body>
<div class="authgate" id="authGate">
  <div class="authcard">
    <div class="auth-logo">REDMOUNT</div>
    <h1>Risk Modeling</h1>
    <p class="sub">Sign in to access client data.</p>
    <label>Email</label>
    <input type="email" id="authEmail" autocomplete="username">
    <label>Password</label>
    <input type="password" id="authPassword" autocomplete="current-password">
    <button id="authSubmit">Sign in</button>
    <div class="err" id="authErr"></div>
  </div>
</div>
<div id="mainApp" style="display:none;">
<div class="shell">
  <aside class="sidebar">
    <div class="brand">REDMOUNT<small>Risk Modeling</small></div>
    <button class="btn" onclick="addClient()">+ New Client</button>
    <input type="text" placeholder="Search clients…" oninput="setClientSearch(this.value)"
      style="width:100%; background:rgba(255,255,255,0.08); border:1px solid rgba(255,255,255,0.18); color:#fff; font-size:12.5px; padding:7px 9px; border-radius:6px;">
    <select id="clientDropdown" onchange="if(this.value) selectClient(this.value);"
      style="width:100%; background:rgba(255,255,255,0.08); border:1px solid rgba(255,255,255,0.18); color:#fff; font-size:12.5px; padding:7px 9px; border-radius:6px; font-family:inherit;">
      <option value="">Jump to client…</option>
    </select>
    <div class="client-item" style="margin-top:6px; border-top:1px solid var(--navy-2); padding-top:14px;" onclick="openDashboard()">🏠 Dashboard</div>
    <div class="client-item" onclick="openLibrary()">📊 Security Library</div>
    <div class="client-item" onclick="openPending()">📥 Pending Submissions<span id="pendingBadge" style="margin-left:6px;"></span></div>
    <div class="client-item" onclick="openScoringWeights()">⚖️ Scoring Weights</div>
    <div class="side-foot">
      Signed in as <span id="authedEmail"></span> · <span class="signout-link" id="signOutBtn" style="cursor:pointer; text-decoration:underline;">Sign out</span>
      <div class="sync-status" id="syncStatus"><span class="sync-dot" id="syncDot"></span><span id="syncText">Idle</span></div>
    </div>

    <div class="nav-divider"></div>
    <div class="tool-switcher-label">Switch Tool</div>
    <select class="tool-switcher" id="toolSwitcher">
      <option value="">— Redmount Tools —</option>
      <option value="https://redmountcurtis.github.io/Redmount-Terminal/">Terminal (Home)</option>
      <option value="https://redmountcurtis.github.io/401k/">Fiduciary Monitor</option>
      <option value="https://redmountcurtis.github.io/capital-stack-navigator/">Capital Stack Navigator</option>
      <option value="https://redmountcurtis.github.io/risk-modeling/" selected disabled>Risk Modeling (current)</option>
      <option value="https://redmountcurtis.github.io/financial-plan/">Financial Plan</option>
      <option value="https://redmountcurtis.github.io/enterprise-capital-strategy/">Enterprise Capital Strategy</option>
    </select>
  </aside>

  <main class="main" id="mainArea">
    <div class="empty" style="margin-top:60px;">Add a client to get started.</div>
  </main>
</div>
</div>
<div id="printArea"></div>

<script>
// ==================== AUTH + PERSISTENCE ====================
const SUPABASE_URL = 'https://pdympbpyavilstjsmjtm.supabase.co';
const SUPABASE_KEY = 'sb_publishable_2CogNhXWXa7phJfFPpxVgg_JEevv89Y';
const AUTH_URL = SUPABASE_URL + '/auth/v1';
const REST_URL = SUPABASE_URL + '/rest/v1';
const EDGE_FUNCTION_URL = SUPABASE_URL + '/functions/v1/signwell-sign';
const SESSION_KEY = 'redmount_session'; // shared across all Redmount tools for single sign-on

function $id(id){ return document.getElementById(id); }

async function authSignIn(email, password){
  const res = await fetch(AUTH_URL+'/token?grant_type=password', {
    method:'POST', headers:{'apikey':SUPABASE_KEY, 'Content-Type':'application/json'},
    body: JSON.stringify({email, password})
  });
  const data = await res.json();
  if(!res.ok) throw new Error(data.error_description || data.msg || 'Incorrect email or password');
  return data;
}
async function authRefresh(refreshToken){
  const res = await fetch(AUTH_URL+'/token?grant_type=refresh_token', {
    method:'POST', headers:{'apikey':SUPABASE_KEY, 'Content-Type':'application/json'},
    body: JSON.stringify({refresh_token:refreshToken})
  });
  const data = await res.json();
  if(!res.ok) throw new Error('refresh failed');
  return data;
}
function saveSession(data){
  const session = {access_token:data.access_token, refresh_token:data.refresh_token,
    expires_at: Date.now() + (data.expires_in||3600)*1000, email: data.user && data.user.email};
  try{ localStorage.setItem(SESSION_KEY, JSON.stringify(session)); }catch(e){}
  return session;
}
function loadStoredSession(){
  try{ const raw = localStorage.getItem(SESSION_KEY); return raw ? JSON.parse(raw) : null; }catch(e){ return null; }
}
function clearSession(){ try{ localStorage.removeItem(SESSION_KEY); }catch(e){} }
async function ensureValidSession(){
  const session = loadStoredSession();
  if(!session) return null;
  if(Date.now() < session.expires_at - 60000) return session;
  try{ const fresh = saveSession(await authRefresh(session.refresh_token)); return fresh; }
  catch(e){ clearSession(); return null; }
}

async function supabaseFetch(path, options){
  options = options || {};
  const session = await ensureValidSession();
  if(!session) throw new Error('Not signed in');
  const headers = Object.assign({
    'apikey': SUPABASE_KEY,
    'Authorization': 'Bearer ' + session.access_token,
    'Content-Type': 'application/json'
  }, options.headers || {});
  const res = await fetch(REST_URL + path, Object.assign({}, options, {headers}));
  if(!res.ok){
    const text = await res.text().catch(()=> '');
    throw new Error('Supabase error ' + res.status + ': ' + text);
  }
  return res;
}

function setSyncStatus(state, text){
  const dot = $id('syncDot'), label = $id('syncText');
  if(!dot) return;
  dot.className = 'sync-dot' + (state ? ' '+state : '');
  label.textContent = text || (state==='saved' ? 'Saved' : state==='saving' ? 'Saving…' : state==='error' ? 'Error saving' : 'Idle');
}

// ---- Remote load ----
async function loadRemoteData(){
  setSyncStatus('saving', 'Loading…');
  try{
    const [clientsRes, settingsRes] = await Promise.all([
      supabaseFetch('/risk_clients?select=id,payload,updated_at&order=updated_at.desc'),
      supabaseFetch('/risk_settings?select=security_library,cma,scoring_weights')
    ]);
    const clientRows = await clientsRes.json();
    const settingsRows = await settingsRes.json();

    clients = clientRows.map(row => migrateClient(Object.assign({}, row.payload, {id: row.id, _remoteId: row.id})));
    activeId = clients.length ? clients[0].id : null;
    clients.forEach(c => { lastSavedHash[c.id] = JSON.stringify(c); });

    if(settingsRows.length && settingsRows[0].security_library && settingsRows[0].security_library.length){
      securityLibrary = settingsRows[0].security_library;
    }
    if(settingsRows.length && settingsRows[0].cma && Object.keys(settingsRows[0].cma).length){
      CMA = settingsRows[0].cma;
    }
    if(settingsRows.length && settingsRows[0].scoring_weights && Object.keys(settingsRows[0].scoring_weights).length){
      SCORING_WEIGHTS = Object.assign({}, SCORING_WEIGHTS, settingsRows[0].scoring_weights); // merge over defaults so new keys aren't lost
    }
    lastSavedSettingsHash = JSON.stringify({securityLibrary, CMA, SCORING_WEIGHTS});
    if(!settingsRows.length){ saveSettingsRemote(); } // seed the row on first login

    setSyncStatus('saved', 'Synced');
  }catch(e){
    console.error(e);
    setSyncStatus('error', 'Could not load — using local data');
  }
}

// ---- Remote save (client) ----
function clientPayload(c){
  const copy = Object.assign({}, c);
  delete copy._remoteId;
  return copy;
}

async function saveClientRemote(c){
  setSyncStatus('saving');
  try{
    if(!c._remoteId){
      const res = await supabaseFetch('/risk_clients', {
        method:'POST',
        headers:{'Prefer':'return=representation'},
        body: JSON.stringify({payload: clientPayload(c)})
      });
      const data = await res.json();
      if(data && data[0]){
        // c.id is intentionally left untouched here — every already-rendered
        // input on the page has this client's id baked into its onchange
        // handler as a literal string (onchange="update('${c.id}', ...)").
        // Reassigning c.id to the new server UUID after the first autosave
        // used to leave every one of those handlers pointing at an id that
        // no longer existed in `clients`, so getClient() returned undefined
        // and every keystroke after that first save silently failed — with
        // the typed characters still visibly sitting in the input (since
        // it's a plain DOM value), making it look like data entry was
        // working when nothing was actually being saved. _remoteId is the
        // only thing that needs the server's real id; c.id stays stable for
        // the lifetime of the session so the DOM never goes stale.
        c._remoteId = data[0].id;
        lastSavedHash[c.id] = JSON.stringify(c);
        renderClientList();
      }
    } else {
      await supabaseFetch('/risk_clients?id=eq.'+c._remoteId, {
        method:'PATCH',
        body: JSON.stringify({payload: clientPayload(c)})
      });
      lastSavedHash[c.id] = JSON.stringify(c);
    }
    setSyncStatus('saved');
  }catch(e){
    console.error(e);
    setSyncStatus('error');
    // Re-thrown (not just logged) so callers like the manual Save button can
    // tell the difference between success and failure. Previously this was
    // swallowed here, so a failed save could still show "Saved ✓" on the
    // button — a false positive that made real failures look like success.
    throw e;
  }
}

async function deleteClientRemote(c){
  if(!c._remoteId) return;
  try{ await supabaseFetch('/risk_clients?id=eq.'+c._remoteId, {method:'DELETE'}); }
  catch(e){ console.error(e); }
}

// Explicit "Save" button handler — bypasses the autosave diff/interval and saves
// immediately, with its own button-level feedback so it's obvious the click worked.
async function forceSaveClient(cid){
  const c = getClient(cid);
  if(!c){
    alert('Could not find this client record to save — try reloading the page before entering more data, and let me know if this keeps happening.');
    return;
  }
  const btn = $id('manualSaveBtn');
  if(btn){ btn.disabled = true; btn.textContent = 'Saving…'; }
  try{
    await saveClientRemote(c);
    if(btn){ btn.textContent = 'Saved ✓'; setTimeout(()=>{ if($id('manualSaveBtn')){ $id('manualSaveBtn').textContent='Save'; $id('manualSaveBtn').disabled=false; } }, 1400); }
  }catch(e){
    console.error(e);
    if(btn){ btn.textContent = 'Save failed — retry'; btn.disabled = false; }
    alert('Save failed: ' + e.message + '\n\nYour changes are still here on screen — try clicking Save again. If it keeps failing, copy this error message.');
  }
}

// "Share with ECS" — Enterprise Capital Strategy keeps its own independent client
// list (not every Risk Modeling client is an ECS engagement, and vice versa), so
// this is an explicit, one-way push rather than an automatic roster sync. If an
// ECS client with the same name already exists, link to it instead of duplicating.
async function shareClientWithECS(cid){
  const c = getClient(cid);
  if(!c) return;
  const first = (c.client1.first||'').trim(), last = (c.client1.last||'').trim();
  if(!first && !last){ alert('Add a client name first.'); return; }
  const btn = $id('shareEcsBtn');
  if(btn){ btn.disabled = true; btn.textContent = 'Sharing…'; }
  try{
    const existingRes = await supabaseFetch('/ecs_clients?select=id,payload');
    const existing = await existingRes.json();
    const match = existing.find(row => {
      const p = row.payload || {};
      return (p.first||'').trim().toLowerCase()===first.toLowerCase() && (p.last||'').trim().toLowerCase()===last.toLowerCase();
    });
    if(match){
      await supabaseFetch('/ecs_clients?id=eq.'+match.id, {
        method:'PATCH',
        body: JSON.stringify({payload: Object.assign({}, match.payload, {linkedRiskClientId: c.id})})
      });
      if(btn){ btn.textContent = 'Linked ✓'; }
    } else {
      await supabaseFetch('/ecs_clients', {
        method:'POST',
        body: JSON.stringify({payload: {first, last, linkedRiskClientId: c.id}})
      });
      if(btn){ btn.textContent = 'Shared ✓'; }
    }
    setTimeout(()=>{ if($id('shareEcsBtn')){ $id('shareEcsBtn').textContent='Share with ECS'; $id('shareEcsBtn').disabled=false; } }, 1600);
  }catch(e){
    console.error(e);
    if(btn){ btn.textContent = 'Share failed — retry'; btn.disabled = false; }
  }
}

async function saveSettingsRemote(){
  setSyncStatus('saving');
  try{
    await supabaseFetch('/risk_settings?on_conflict=user_id', {
      method:'POST',
      headers:{'Prefer':'resolution=merge-duplicates,return=minimal'},
      body: JSON.stringify({security_library: securityLibrary, cma: CMA, scoring_weights: SCORING_WEIGHTS})
    });
    lastSavedSettingsHash = JSON.stringify({securityLibrary, CMA, SCORING_WEIGHTS});
    setSyncStatus('saved');
  }catch(e){
    console.error(e);
    setSyncStatus('error');
    throw e;
  }
}

// ---- Autosave loop: diff current state against last-saved snapshot every few seconds ----
let lastSavedHash = {};
let lastSavedSettingsHash = '';
// Tracks clients with a save currently in flight, so a slow save doesn't get
// a second overlapping save started for the same client on the next tick.
const saveInFlight = {};
function autosaveTick(){
  clients.forEach(c=>{
    const json = JSON.stringify(c);
    if(lastSavedHash[c.id] !== json && !saveInFlight[c.id]){
      saveInFlight[c.id] = true;
      saveClientRemote(c)
        .then(() => {
          // Hash only updated on confirmed success — previously this was
          // set optimistically before the save even started, so a failed
          // save still marked itself as "up to date" and was never retried.
          // That's a silent, permanent data-loss path: the change would
          // just never get saved again until the user made another edit.
          lastSavedHash[c.id] = json;
        })
        .catch(() => {
          // Left unmarked on failure so the next tick (4s later) retries
          // automatically. setSyncStatus('error') already fired inside
          // saveClientRemote, so the sync indicator reflects this.
        })
        .finally(() => { saveInFlight[c.id] = false; });
    }
  });
  const settingsJson = JSON.stringify({securityLibrary, CMA, SCORING_WEIGHTS});
  if(settingsJson !== lastSavedSettingsHash && !saveInFlight['__settings__']){
    saveInFlight['__settings__'] = true;
    saveSettingsRemote()
      .catch(() => {})
      .finally(() => { saveInFlight['__settings__'] = false; });
  }
}
setInterval(autosaveTick, 4000);
window.addEventListener('beforeunload', autosaveTick);
document.addEventListener('visibilitychange', ()=>{ if(document.hidden) autosaveTick(); });

function enterApp(){
  $id('authGate').style.display = 'none';
  $id('mainApp').style.display = 'block';
}

$id('authSubmit') && $id('authSubmit').addEventListener('click', async function(){
  const email = $id('authEmail').value.trim();
  const password = $id('authPassword').value;
  if(!email || !password){ showAuthErr('Enter an email and password.'); return; }
  $id('authSubmit').disabled = true;
  try{
    const data = await authSignIn(email, password);
    saveSession(data);
    $id('authedEmail').textContent = data.user.email;
    enterApp();
    await loadRemoteData();
    renderAll();
    refreshPendingBadge();
  }catch(e){ showAuthErr(e.message || 'Incorrect email or password'); }
  $id('authSubmit').disabled = false;
});
function showAuthErr(msg){ const el = $id('authErr'); el.textContent = msg; el.classList.add('show'); }

document.addEventListener('DOMContentLoaded', function(){
  const signOutBtn = $id('signOutBtn');
  if(signOutBtn) signOutBtn.addEventListener('click', function(){
    autosaveTick();
    clearSession();
    $id('mainApp').style.display = 'none';
    $id('authGate').style.display = 'flex';
    $id('authEmail').value=''; $id('authPassword').value='';
    clients = []; activeId = null; lastSavedHash = {};
  });
});

async function initAuth(){
  const session = await ensureValidSession();
  if(session){
    $id('authedEmail').textContent = session.email || '';
    enterApp();
    await loadRemoteData();
    renderAll();
    refreshPendingBadge();
  } else {
    $id('authGate').style.display = 'flex';
    $id('mainApp').style.display = 'none';
  }
}

function findSecurity(ticker){
  if(!ticker) return null;
  const t = ticker.trim().toUpperCase();
  return securityLibrary.find(s=>s.ticker===t) || null;
}

function resolveHoldingScore(h){
  const sec = findSecurity(h.ticker);
  if(sec) return sec.score;
  const cls = ASSET_CLASSES.find(a=>a.key===h.assetClass);
  return cls ? cls.weight : null;
}

    riskTolerance:'', objective:'', horizon:'', liquidityImportance:'', drawingFromHoldings:'no',
    otherIncomeSources: [], otherIncomeOther: '',
    issuesForDiscussion: [], issuesOther: '',
    recommendations:'', notes:'',
    accounts: [],
    proposedScenarios: [{id: uid('sc'), name:'Scenario 1', holdings: []}],
    activeScenarioId: null,
    reviewHistory: []
  };
}

function migrateClient(c){
  // Backward-compat for clients saved before scenarios/history/beneficiary structure existed.
  if(!c.proposedScenarios){
    c.proposedScenarios = [{id: uid('sc'), name:'Scenario 1', holdings: c.proposedHoldings || []}];
  }
  if(!c.activeScenarioId || !c.proposedScenarios.find(s=>s.id===c.activeScenarioId)){
    c.activeScenarioId = c.proposedScenarios[0].id;
  }
  if(!c.reviewHistory) c.reviewHistory = [];
  c.reviewHistory.forEach(h=>{
    if(h.signatureStatus===undefined) h.signatureStatus = 'unsigned';
    if(h.signedDate===undefined) h.signedDate = null;
    if(h.signedFileName===undefined) h.signedFileName = null;
    if(h.signedFileData===undefined) h.signedFileData = null;
    if(h.signedFilePath===undefined) h.signedFilePath = null;
  });
  if(!c.otherIncomeSources) c.otherIncomeSources = [];
  if(c.otherIncomeOther===undefined) c.otherIncomeOther = '';
  if(!c.issuesForDiscussion) c.issuesForDiscussion = [];
  if(c.issuesOther===undefined) c.issuesOther = '';
  if(!c.beneficiaries) c.beneficiaries = [];
  if(!c.questionnaire) c.questionnaire = {lossReaction:'', historicalBehavior:'', maxLossTolerance:'', gainFlipChoice:'', lossFlipChoice:'', incomeStability:'', experienceLevel:''};
  if(c.questionnaire.gainFlipChoice===undefined) c.questionnaire.gainFlipChoice = '';
  if(c.questionnaire.lossFlipChoice===undefined) c.questionnaire.lossFlipChoice = '';
  if(c.age===undefined) c.age = '';
  if(c.financial && c.financial.annualExpense===undefined) c.financial.annualExpense = '';
  if(!c.household) c.household = {size:'', dependentsUnder18:'', healthStatus:'', incomeSector:'', ownsPropertyInZip:''};
  if(!c.goal) c.goal = {description:'', targetAmount:'', years:'', annualContribution:''};
  if(c.financial && c.financial.investableAssets===undefined) c.financial.investableAssets = '';
  return c;
}

function activeScenario(c){
  return c.proposedScenarios.find(s=>s.id===c.activeScenarioId) || c.proposedScenarios[0];
}

function addClient(){
  const c = blankClient();
  c.activeScenarioId = c.proposedScenarios[0].id;
  clients.push(c);
  activeId = c.id;
  activeTab = 'profile';
  currentView = 'clients';
  renderAll();
}

function getClient(id){ const c = clients.find(c=>c.id===id); return c ? migrateClient(c) : c; }

function removeClient(id){
  const c = clients.find(c=>c.id===id);
  const name = c ? ((c.client1.first||'')+' '+(c.client1.last||'')).trim() || 'this client' : 'this client';
  if(!confirm(`Permanently delete ${name}? This removes their profile, accounts, holdings, questionnaire, and review history. This cannot be undone.`)) return;
  if(c) deleteClientRemote(c);
  delete lastSavedHash[id];
  clients = clients.filter(c=>c.id!==id);
  if(activeId===id) activeId = clients.length ? clients[0].id : null;
  renderAll();
}

// ---------- SCORING ----------
// Risk Preference — the client's stated willingness to take risk (self-reported).
// Behavioral questionnaire score — concrete scenario answers instead of an abstract self-label.
// This is the primary driver of Risk Preference when completed; it's what a client actually does,
// not what they think they'd do.
// Editable scoring weights — advisor-tunable via the Scoring Weights view, persisted to risk_settings.
// Each score function normalizes by the sum of whatever weights are actually present for a given
// client (see totalW below), so these don't need to sum to exactly 1 — only their ratios matter.
let SCORING_WEIGHTS = {
  capHorizon: 0.30, capLiquidity: 0.25, capAssets: 0.25, capAge: 0.20,
  prefRiskTolerance: 0.60, prefObjective: 0.40,
  prefBlendQuestionnaire: 0.80, prefBlendRiskTolerance: 0.12, prefBlendObjective: 0.08,
  qLossReaction: 0.25, qHistorical: 0.15, qMaxLoss: 0.20, qGainFlip: 0.125, qLossFlip: 0.125, qIncome: 0.05, qExperience: 0.10,
};

// Human-readable versions of the raw answer values, for the full submission review view.
const ANSWER_LABELS = {
  lossReaction: {
    sell_all: 'Sell everything and move to cash to stop further losses',
    sell_some: 'Sell some riskier holdings to reduce exposure',
    hold: "Do nothing and wait it out",
    buy_little: 'Buy a little more while prices are down',
    buy_lot: 'Buy significantly more — this looks like an opportunity',
  },
  historicalBehavior: {
    sold_often: "Sold out of fear more than once",
    sold_once: 'Sold at least once and regretted it later',
    held: "Held steady and didn't change anything",
    bought_more: 'Bought more while prices were down',
  },
  gainFlipChoice: { flip: 'Chose the coin flip (the gamble)', certain: 'Chose the sure gain' },
  lossFlipChoice: { flip: 'Chose the coin flip (the gamble)', certain: 'Chose the sure loss' },
  incomeStability: { decline: 'Likely decline', stable: 'Stay about the same', grow: 'Likely grow' },
  experienceLevel: {
    novice: "New to investing — haven't been through a real downturn",
    some: 'Some experience — lived through at least one downturn',
    experienced: 'Extensive experience across multiple market cycles',
  },
};
function answerLabel(field, val){
  return (ANSWER_LABELS[field] && ANSWER_LABELS[field][val]) || val || '—';
}

const Q_MAPS = {
  lossReaction: {sell_all:5, sell_some:25, hold:55, buy_little:80, buy_lot:95},
  historicalBehavior: {sold_often:15, sold_once:35, held:65, bought_more:90},
  // Prospect-theory certainty-equivalent pair. Most people are risk-averse on gains (prefer the
  // certain amount) and risk-seeking on losses (prefer the gamble to avoid a locked-in loss) — the
  // "reflection effect." Choosing the atypical option on either side signals elevated risk comfort.
  gainFlipChoice: {flip:75, certain:35},
  lossFlipChoice: {flip:45, certain:70},
  incomeStability: {decline:20, stable:50, grow:75},
  experienceLevel: {novice:30, some:55, experienced:80},
};
function questionnaireScore(c){
  const q = c.questionnaire || {};
  const parts = [];
  if(Q_MAPS.lossReaction[q.lossReaction]!==undefined) parts.push({v:Q_MAPS.lossReaction[q.lossReaction], w:SCORING_WEIGHTS.qLossReaction});
  if(Q_MAPS.historicalBehavior[q.historicalBehavior]!==undefined) parts.push({v:Q_MAPS.historicalBehavior[q.historicalBehavior], w:SCORING_WEIGHTS.qHistorical});
  if(q.maxLossTolerance!=='' && q.maxLossTolerance!==undefined && q.maxLossTolerance!==null){
    parts.push({v: Math.min(100, Math.max(0, parseFloat(q.maxLossTolerance)*2)), w:SCORING_WEIGHTS.qMaxLoss});
  }
  if(Q_MAPS.gainFlipChoice[q.gainFlipChoice]!==undefined) parts.push({v:Q_MAPS.gainFlipChoice[q.gainFlipChoice], w:SCORING_WEIGHTS.qGainFlip});
  if(Q_MAPS.lossFlipChoice[q.lossFlipChoice]!==undefined) parts.push({v:Q_MAPS.lossFlipChoice[q.lossFlipChoice], w:SCORING_WEIGHTS.qLossFlip});
  if(Q_MAPS.incomeStability[q.incomeStability]!==undefined) parts.push({v:Q_MAPS.incomeStability[q.incomeStability], w:SCORING_WEIGHTS.qIncome});
  if(Q_MAPS.experienceLevel[q.experienceLevel]!==undefined) parts.push({v:Q_MAPS.experienceLevel[q.experienceLevel], w:SCORING_WEIGHTS.qExperience});
  if(parts.length===0) return null;
  const totalW = parts.reduce((s,p)=>s+p.w,0);
  return Math.round(parts.reduce((s,p)=>s + p.v*(p.w/totalW), 0));
}

// ---- Risk Required — the return actually needed to hit the client's goal, independent of what
// they're willing (Preference) or able (Capacity) to take. Most tools never surface this. ----
function solveRequiredReturn(pv, contribution, years, goalFV){
  if(!years || years<=0 || !goalFV || goalFV<=0) return null;
  function fv(r){
    let bal = pv || 0;
    for(let y=0; y<years; y++){ bal = bal*(1+r) + (contribution||0); }
    return bal;
  }
  if(fv(0) >= goalFV) return 0; // already on track without any growth
  let lo = 0, hi = 2.0; // 0%–200% annual return search bounds
  if(fv(hi) < goalFV) return null; // not attainable within a sane return range — goal/timeline/savings mismatch
  for(let i=0; i<60; i++){
    const mid = (lo+hi)/2;
    if(fv(mid) < goalFV) lo = mid; else hi = mid;
  }
  return ((lo+hi)/2) * 100; // as a percent
}

function requiredScoreFromReturn(retPct){
  const pts = ASSET_CLASSES.map(a=>({ret: CMA[a.key].ret, score: a.weight})).sort((a,b)=>a.ret-b.ret);
  if(retPct <= pts[0].ret) return Math.max(0, Math.round(pts[0].score - (pts[0].ret-retPct)*3));
  if(retPct >= pts[pts.length-1].ret) return 'exceeds';
  for(let i=0; i<pts.length-1; i++){
    if(retPct>=pts[i].ret && retPct<=pts[i+1].ret){
      const frac = (retPct-pts[i].ret)/(pts[i+1].ret-pts[i].ret);
      return Math.round(pts[i].score + frac*(pts[i+1].score-pts[i].score));
    }
  }
  return null;
}

// Returns {requiredReturn, score} where score is a number, 'exceeds' (goal needs more risk than any
// modeled asset class plausibly provides), or null (missing inputs / not attainable at any sane return).
function riskRequired(c){
  const pv = parseFloat(c.financial.investableAssets) || 0;
  const contribution = parseFloat(c.goal.annualContribution) || 0;
  const years = parseFloat(c.goal.years) || 0;
  const goalFV = parseFloat(c.goal.targetAmount) || 0;
  if(!years || !goalFV) return null;
  const retPct = solveRequiredReturn(pv, contribution, years, goalFV);
  if(retPct === null) return {requiredReturn: null, score: 'unattainable'};
  return {requiredReturn: retPct, score: requiredScoreFromReturn(retPct)};
}

function riskPreferenceScore(c){
  const qScore = questionnaireScore(c);
  const map = {
    riskTolerance: {'Conservative':10,'Moderately Conservative':30,'Moderate':50,'Moderately Aggressive':70,'Aggressive':90},
    objective: {'Safety of Principal':10,'Tax Advantaged':30,'Income':40,'Growth':70,'Speculation':90},
  };
  const rt = map.riskTolerance[c.riskTolerance];
  const ob = map.objective[c.objective];
  if(qScore!==null){
    // Questionnaire (behavioral, concrete) drives the score; the self-rated dropdowns act as a light sanity-check weight.
    const parts = [{v:qScore, w:SCORING_WEIGHTS.prefBlendQuestionnaire}];
    if(rt!==undefined) parts.push({v:rt, w:SCORING_WEIGHTS.prefBlendRiskTolerance});
    if(ob!==undefined) parts.push({v:ob, w:SCORING_WEIGHTS.prefBlendObjective});
    const totalW = parts.reduce((s,p)=>s+p.w,0);
    return Math.round(parts.reduce((s,p)=>s + p.v*(p.w/totalW), 0));
  }
  // No questionnaire completed yet — fall back to the self-rated dropdowns alone.
  const parts = [
    rt!==undefined ? {v:rt, w:SCORING_WEIGHTS.prefRiskTolerance} : null,
    ob!==undefined ? {v:ob, w:SCORING_WEIGHTS.prefObjective} : null,
  ].filter(Boolean);
  if(parts.length===0) return null;
  const totalW = parts.reduce((s,p)=>s+p.w,0);
  return Math.round(parts.reduce((s,p)=>s + p.v*(p.w/totalW), 0));
}

// Risk Capacity — the client's objective financial ability to absorb a loss, independent of feelings.
// Age-based capacity curve, anchored to the industry-standard glidepath bands: roughly aggressive
// under 35, moderate 36-55, conservative 56+, smoothly interpolated rather than a hard cutoff.
function capacityFromAge(age){
  const pts = [[18,95],[35,75],[55,45],[75,20],[100,5]];
  if(age<=pts[0][0]) return pts[0][1];
  if(age>=pts[pts.length-1][0]) return pts[pts.length-1][1];
  for(let i=0;i<pts.length-1;i++){
    if(age>=pts[i][0] && age<=pts[i+1][0]){
      const frac = (age-pts[i][0])/(pts[i+1][0]-pts[i][0]);
      return pts[i][1] + frac*(pts[i+1][1]-pts[i][1]);
    }
  }
  return 50;
}
function ageBand(age){
  if(age<=35) return {label:'Aggressive', range:'71–100% equity', age:'18–35'};
  if(age<=55) return {label:'Moderate', range:'21–70% equity', age:'36–55'};
  return {label:'Conservative', range:'0–20% equity', age:'56+'};
}

function riskCapacityScore(c){
  const map = {
    horizon: {'Under 1 year':8,'1-3 years':22,'3-5 years':38,'5-10 years':58,'10-20 years':78,'20+ years':92},
    liquidity: {'Very Important':18,'Somewhat Important':45,'Not Important':72},
    assets: {'Under $200K':15,'$200-500K':30,'$500K-1 Million':45,'$1-2 Million':65,'Over $2 Million':85}
  };
  const hz = map.horizon[c.horizon];
  const lq = map.liquidity[c.liquidityImportance];
  const as = map.assets[c.financial.totalAssets];
  const age = parseFloat(c.age);
  const ageScore = age ? capacityFromAge(age) : undefined;
  const parts = [
    hz!==undefined ? {v:hz, w:SCORING_WEIGHTS.capHorizon} : null,
    lq!==undefined ? {v:lq, w:SCORING_WEIGHTS.capLiquidity} : null,
    as!==undefined ? {v:as, w:SCORING_WEIGHTS.capAssets} : null,
    ageScore!==undefined ? {v:ageScore, w:SCORING_WEIGHTS.capAge} : null,
  ].filter(Boolean);
  if(parts.length===0) return null;
  const totalW = parts.reduce((s,p)=>s+p.w,0);
  let score = parts.reduce((s,p)=>s + p.v*(p.w/totalW), 0);

  // Expense-burden penalty: high fixed spending relative to net worth erodes capacity independent
  // of the inputs above — a household spending 15%+ of net worth a year has less room to absorb a drawdown.
  const netWorth = parseFloat(c.financial.netWorth) || 0;
  const expense = parseFloat(c.financial.annualExpense) || 0;
  if(netWorth > 0 && expense > 0){
    const ratio = expense / netWorth;
    if(ratio > 0.08) score -= Math.min(20, (ratio-0.08)*300);
  }
  return Math.round(Math.max(0, Math.min(100, score)));
}

function portfolioScore(c){
  let totalValue = 0, weighted = 0;
  c.accounts.forEach(acc=>{
    acc.holdings.forEach(h=>{
      const val = parseFloat(h.value) || 0;
      const score = resolveHoldingScore(h);
      if(val>0 && score!==null){ totalValue += val; weighted += val*score; }
    });
  });
  if(totalValue===0) return null;
  return Math.round(weighted/totalValue);
}

const ASSET_CLASS_COLOR = {
  us_large:'#2F6FED', us_small:'#8B5CF6', us_reit:'#10B981', intl_large:'#06B6D4', em_equity:'#DB2777',
  us_bonds:'#2563EB', us_hy:'#F59E0B', us_tips:'#0EA5E9', us_int_treasury:'#60A5FA', us_long_treasury:'#1D4ED8',
  intl_govt_bonds:'#0891B2', em_sovereign:'#BE185D', private_equity:'#7C3AED', private_re:'#059669',
  infrastructure:'#EA580C', commodities:'#CA8A04', us_cash:'#9CA3AF', lev:'#EF4444'
};

function portfolioValue(c){
  let total = 0;
  c.accounts.forEach(acc=> acc.holdings.forEach(h=> total += (parseFloat(h.value)||0)));
  return total;
}

function proposedScore(c){
  const holdings = activeScenario(c).holdings || [];
  let totalValue = 0, weighted = 0;
  holdings.forEach(h=>{
    const val = parseFloat(h.value) || 0;
    const score = resolveHoldingScore(h);
    if(val>0 && score!==null){ totalValue += val; weighted += val*score; }
  });
  if(totalValue===0) return null;
  return Math.round(weighted/totalValue);
}

function proposedValue(c){
  return (activeScenario(c).holdings||[]).reduce((s,h)=>s+(parseFloat(h.value)||0),0);
}

function allocationBreakdown(holdings){
  const totals = {};
  let grand = 0;
  holdings.forEach(h=>{
    const val = parseFloat(h.value) || 0;
    if(val<=0) return;
    const sec = findSecurity(h.ticker);
    const key = sec ? sec.assetClass : h.assetClass;
    totals[key] = (totals[key]||0) + val;
    grand += val;
  });
  return ASSET_CLASSES
    .map(a=>({key:a.key, label:a.label, value:totals[a.key]||0, color:ASSET_CLASS_COLOR[a.key]}))
    .filter(a=>a.value>0)
    .map(a=>({...a, pct: grand ? (a.value/grand*100) : 0}));
}

const FIELD_PALETTE = ['#2F6FED','#8B5CF6','#06B6D4','#10B981','#F59E0B','#DB2777','#EF4444','#9CA3AF','#60A5FA','#177350','#8a5a00'];

function fieldBreakdown(holdings, field, unclassifiedLabel){
  const totals = {};
  let grand = 0;
  holdings.forEach(h=>{
    const val = parseFloat(h.value) || 0;
    if(val<=0) return;
    const sec = findSecurity(h.ticker);
    const key = sec && sec[field] ? sec[field] : unclassifiedLabel;
    totals[key] = (totals[key]||0) + val;
    grand += val;
  });
  const keys = Object.keys(totals);
  return keys.map((key,i)=>({
    key, label:key, value:totals[key],
    color: FIELD_PALETTE[i % FIELD_PALETTE.length],
    pct: grand ? (totals[key]/grand*100) : 0
  })).sort((a,b)=>b.value-a.value);
}

function donutSVG(breakdown, size){
  size = size || 160;
  const r = size*0.36, cx = size/2, cy = size/2, circ = 2*Math.PI*r;
  const strokeW = size*0.16;
  let offset = 0;
  const segs = breakdown.map(b=>{
    const len = circ * (b.pct/100);
    const seg = `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${b.color}" stroke-width="${strokeW}"
      stroke-dasharray="${len} ${circ-len}" stroke-dashoffset="${-offset}" transform="rotate(-90 ${cx} ${cy})"/>`;
    offset += len;
    return seg;
  }).join('');
  // Outer + inner frame rings so the chart reads as a distinct object on a white
  // page instead of floating color segments with nothing to anchor them.
  const outerR = r + strokeW/2 + 3;
  const innerR = r - strokeW/2 - 2;
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">
    <circle cx="${cx}" cy="${cy}" r="${outerR}" fill="none" stroke="#dde3ee" stroke-width="1.5"/>
    <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="#eef1f6" stroke-width="${strokeW}"/>
    ${segs}
    <circle cx="${cx}" cy="${cy}" r="${innerR}" fill="#fff" stroke="#eef1f6" stroke-width="1"/>
  </svg>`;
}

// Wraps a donut (or any small SVG widget) in a bordered card so it reads as a
// distinct object on the page, matching how TIFIN/Riskalyze box every chart
// widget rather than letting it float loose against the background.
function chartCard(inner, label){
  return `<div style="display:inline-block; border:1px solid #e2e6ee; border-radius:12px; padding:14px; background:#fff; box-shadow:0 1px 2px rgba(15,35,71,0.04);">
    ${inner}
    ${label ? `<div style="font-size:10px; font-weight:700; color:#5b6b82; text-transform:uppercase; letter-spacing:.03em; text-align:center; margin-top:6px;">${label}</div>` : ''}
  </div>`;
}

function legendHTML(breakdown){
  if(breakdown.length===0) return '<div style="font-size:11.5px; color:var(--ink-dim);">No holdings entered.</div>';
  return `<div style="display:flex; flex-direction:column; gap:4px;">${breakdown.map(b=>`
    <div style="display:flex; align-items:center; gap:6px; font-size:11px;">
      <span style="width:9px; height:9px; border-radius:2px; background:${b.color}; flex-shrink:0;"></span>
      <span style="flex:1; color:var(--ink-dim);">${b.label}</span>
      <span style="font-weight:600;">${b.pct.toFixed(0)}%</span>
    </div>`).join('')}</div>`;
}

function possibleLossGain(score, value){
  if(score===null || !value) return null;
  const lossPct = score;
  const gainPct = score * 1.35; // asymmetric upside skew consistent with lognormal return distributions
  return {
    lossPct, gainPct,
    lossDollar: value * (lossPct/100),
    gainDollar: value * (gainPct/100)
  };
}

function lossGainBarSVG(lg, w){
  w = w || 460;
  const h = 40, cx = w/2;
  const lossW = Math.min(cx-4, (lg.lossPct/100) * (cx-4));
  const gainW = Math.min(cx-4, (lg.gainPct/100) * (cx-4));
  return `<svg width="100%" viewBox="0 0 ${w} ${h}" style="display:block;">
    <rect x="4" y="16" width="${w-8}" height="8" rx="4" fill="#eef1f6"/>
    <rect x="${cx-lossW}" y="16" width="${lossW}" height="8" rx="4" fill="#9c2b2b"/>
    <rect x="${cx}" y="16" width="${gainW}" height="8" rx="4" fill="#177350"/>
    <line x1="${cx}" y1="8" x2="${cx}" y2="32" stroke="#5b6b82" stroke-width="1"/>
    <text x="4" y="38" font-size="10" fill="#5b6b82" font-family="inherit">-100%</text>
    <text x="${w-4}" y="38" font-size="10" fill="#5b6b82" text-anchor="end" font-family="inherit">+100%</text>
  </svg>`;
}

function resolveHoldingExpense(h){
  const sec = findSecurity(h.ticker);
  return sec && sec.expenseRatio!==undefined ? sec.expenseRatio : 0;
}

function portfolioExpenseRatio(holdings){
  let totalValue = 0, weighted = 0;
  holdings.forEach(h=>{
    const val = parseFloat(h.value) || 0;
    if(val<=0) return;
    totalValue += val;
    weighted += val * resolveHoldingExpense(h);
  });
  return totalValue ? weighted/totalValue : null;
}

function miniRingSVG(score, size){
  size = size || 26;
  if(score===null || score===undefined) return `<span style="display:inline-block; width:${size}px; height:${size}px;"></span>`;
  const r = size*0.4, cx=size/2, cy=size/2, circ = 2*Math.PI*r;
  const len = circ * (score/100);
  const color = score>=70 ? '#9c2b2b' : score>=40 ? '#8a5a00' : '#177350';
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" style="vertical-align:middle;">
    <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="#eef1f6" stroke-width="${size*0.16}"/>
    <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${color}" stroke-width="${size*0.16}"
      stroke-dasharray="${len} ${circ-len}" transform="rotate(-90 ${cx} ${cy})"/>
    <text x="${cx}" y="${cy+3}" font-size="${size*0.32}" fill="${color}" text-anchor="middle" font-weight="700" font-family="inherit">${score}</text>
  </svg>`;
}

// ---------- Capital Market Assumptions (editable, drive the 10-yr projection) ----------
let CMA = {
  us_large:         {ret:6.94, vol:16.37},
  us_small:         {ret:6.69, vol:21.26},
  us_reit:          {ret:6.50, vol:18.90},
  intl_large:       {ret:7.44, vol:17.26},

function portfolioAssumptions(alloc){
  // alloc: array from allocationBreakdown() — {key, pct, ...}. Weighted avg return/vol (ignores correlation — see disclosure).
  if(!alloc.length) return null;
  let ret=0, vol=0;
  alloc.forEach(a=>{
    const cma = CMA[a.key];
    if(!cma) return;
    ret += (a.pct/100) * cma.ret;
    vol += (a.pct/100) * cma.vol;
  });
  return {ret, vol};
}

function projectionFanSVG(startValue, assumptions, years, w){
  years = years || 10; w = w || 460;
  const h = 220, padL = 54, padB = 26, padT = 10;
  const plotW = w - padL - 14, plotH = h - padT - padB;
  const mu = assumptions.ret/100, sigma = assumptions.vol/100;
  const z = 1.036; // ~85th/15th percentile, matching a ~70% confidence band
  const points = [];
  for(let t=0;t<=years;t++){
    const mean = startValue * Math.exp((mu - 0.5*sigma*sigma)*t);
    const upper = startValue * Math.exp((mu - 0.5*sigma*sigma)*t + z*sigma*Math.sqrt(t));
    const lower = startValue * Math.exp((mu - 0.5*sigma*sigma)*t - z*sigma*Math.sqrt(t));
    points.push({t, mean, upper, lower});
  }
  const maxV = Math.max(...points.map(p=>p.upper));
  const minV = Math.min(...points.map(p=>p.lower), startValue*0.5);
  const xFor = t => padL + (t/years)*plotW;
  const yFor = v => padT + plotH - ((v-minV)/(maxV-minV))*plotH;

  const upperPath = points.map((p,i)=> (i===0?'M':'L') + xFor(p.t) + ' ' + yFor(p.upper)).join(' ');
  const lowerPathRev = points.slice().reverse().map(p=> 'L' + xFor(p.t) + ' ' + yFor(p.lower)).join(' ');
  const meanPath = points.map((p,i)=> (i===0?'M':'L') + xFor(p.t) + ' ' + yFor(p.mean)).join(' ');
  const band = `${upperPath} ${lowerPathRev} Z`;

  const fmt = v => v>=1000000 ? '$'+(v/1000000).toFixed(2)+'M' : '$'+(v/1000).toFixed(0)+'K';
  const yTicks = [minV, (minV+maxV)/2, maxV].map(v=>`
    <text x="${padL-6}" y="${yFor(v)+3}" font-size="9.5" fill="#5b6b82" text-anchor="end" font-family="inherit">${fmt(v)}</text>
    <line x1="${padL}" y1="${yFor(v)}" x2="${w-14}" y2="${yFor(v)}" stroke="#f0f2f6" stroke-width="1"/>`).join('');
  const xTicks = [0,2,4,6,8,10].filter(t=>t<=years).map(t=>`
    <text x="${xFor(t)}" y="${h-6}" font-size="9.5" fill="#5b6b82" text-anchor="middle" font-family="inherit">${t===0?'Today':'Yr '+t}</text>`).join('');

  return `<svg width="100%" viewBox="0 0 ${w} ${h}" style="display:block;">
    ${yTicks}${xTicks}
    <path d="${band}" fill="#2f6fed" opacity="0.10"/>
    <path d="${meanPath}" fill="none" stroke="#2f6fed" stroke-width="2"/>
    <path d="${upperPath}" fill="none" stroke="#2f6fed" stroke-width="1" opacity="0.4"/>
    <path d="${points.map((p,i)=> (i===0?'M':'L') + xFor(p.t) + ' ' + yFor(p.lower)).join(' ')}" fill="none" stroke="#2f6fed" stroke-width="1" opacity="0.4"/>
  </svg>`;
}


// Measures actual rendered text width via a hidden, reusable SVG node rather than
// guessing a per-character pixel width — bold fonts and proportional glyph widths
// make character-count estimates unreliable enough to cause real layout overlap.
let _measureSvgEl = null;
function measureTextWidth(text, fontSize, fontWeight){
  if(typeof document === 'undefined') return String(text).length * fontSize * 0.55; // PDF-string build fallback
  if(!_measureSvgEl){
    _measureSvgEl = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    _measureSvgEl.setAttribute('style', 'position:absolute; width:0; height:0; overflow:hidden; visibility:hidden;');
    document.body.appendChild(_measureSvgEl);
  }
  const t = document.createElementNS('http://www.w3.org/2000/svg', 'text');
  t.setAttribute('font-size', fontSize);
  t.setAttribute('font-weight', fontWeight || 700);
  t.setAttribute('font-family', '-apple-system,"Segoe UI",Helvetica,Arial,sans-serif');
  t.textContent = text;
  _measureSvgEl.appendChild(t);
  let w;
  try{ w = t.getBBox().width; } catch(e){ w = String(text).length * fontSize * 0.55; }
  _measureSvgEl.removeChild(t);
  return w;
}

function riskBandSVG(capacity, preference, current, proposed, required, opts){
  opts = opts || {};
  const big = !!opts.large;
  const w = big ? 760 : 640;
  const h = big ? 232 : 172;
  const padX = big ? 50 : 36;
  const trackY = big ? 112 : 80;
  const trackW = w - padX*2;
  const xFor = v => padX + (v/100)*trackW;
  const fontSize = big ? 13 : 10;

  let band = '';
  if(capacity!==null && preference!==null){
    const lo = Math.min(capacity, preference), hi = Math.max(capacity, preference);
    band = `<rect x="${xFor(lo)}" y="${trackY-9}" width="${Math.max(2,xFor(hi)-xFor(lo))}" height="18" rx="4" fill="#2f6fed" opacity="0.13"/>`;
  }
  const ticks = [0,25,50,75,100].map(v=>`
    <line x1="${xFor(v)}" y1="${trackY-13}" x2="${xFor(v)}" y2="${trackY+13}" stroke="#e2e6ee" stroke-width="1"/>
    <text x="${xFor(v)}" y="${trackY+(big?27:20)}" font-size="${fontSize}" fill="#5b6b82" text-anchor="middle" font-family="inherit">${v}</text>`).join('');

  // Capacity and Preference each get a label block in their OWN fixed row —
  // always above and always below the track, respectively — so the LABEL never
  // has anything to collide with regardless of value. But the small marker icon
  // itself still sits on the shared track line alongside Current/Proposed/
  // Required, so it joins the same collision pass as those below; only the
  // label position is exempt from ever moving.
  const trackMarkers = [];
  if(capacity!==null) trackMarkers.push({key:'capacity', x:xFor(capacity), r: big?7:5.5, kind:'capacity'});
  if(preference!==null) trackMarkers.push({key:'preference', x:xFor(preference), r: big?7:5.5, kind:'preference'});
  if(required!==null && required!==undefined && typeof required==='number'){
    const rv = Math.max(0, Math.min(100, required));
    trackMarkers.push({key:'required', label:'Required', x:xFor(rv), r: big?11:8, kind:'diamond', fill:'#8B5CF6', value:required, textColor:'#fff'});
  }
  if(current!==null) trackMarkers.push({key:'current', label:'Current', x:xFor(current), r: big?14:10, kind:'circle', fill:'#0e1a2b', stroke:null, value:current, textColor:'#fff'});
  if(proposed!==null) trackMarkers.push({key:'proposed', label:'Proposed', x:xFor(proposed), r: big?14:10, kind:'circle', fill:'#fff', stroke:'#177350', value:proposed, textColor:'#177350'});

  // Every marker starts on the track; nudge apart any pair (regardless of type)
  // whose icons would otherwise touch, working left to right.
  trackMarkers.sort((a,b)=>a.x-b.x);
  trackMarkers.forEach(m=>{ m.cy = trackY; });
  for(let i=1;i<trackMarkers.length;i++){
    const a = trackMarkers[i-1], b = trackMarkers[i];
    if(Math.abs(a.x-b.x) < (a.r+b.r+6) && a.cy===trackY && b.cy===trackY){
      a.cy = trackY - (big?15:11);
      b.cy = trackY + (big?15:11);
    }
  }
  const byKey = {};
  trackMarkers.forEach(m=>{ byKey[m.key] = m; });

  let capacityGroup = '', preferenceGroup = '';
  if(capacity!==null){
    const m = byKey.capacity;
    const trueX = m.x, markerY = m.cy;
    const cx = Math.max(padX+38, Math.min(w-padX-38, trueX));
    const numY = big ? 62 : 44, labelY = big ? 46 : 32, leaderEndY = big ? 70 : 50;
    const leader = markerY!==trackY ? `<line x1="${trueX}" y1="${trackY}" x2="${trueX}" y2="${markerY}" stroke="#c2860a" stroke-width="1" opacity="0.45"/>` : '';
    capacityGroup = `
      ${leader}
      <line x1="${trueX}" y1="${markerY-9}" x2="${cx}" y2="${leaderEndY}" stroke="#c2860a" stroke-width="1" stroke-dasharray="2 2" opacity="0.6"/>
      <path d="M ${trueX} ${markerY-9} L ${trueX+7} ${markerY} L ${trueX} ${markerY+9} L ${trueX-7} ${markerY} Z" fill="#c2860a"/>
      <text x="${cx}" y="${labelY}" font-size="${big?11.5:9}" fill="#c2860a" text-anchor="middle" font-weight="700" font-family="inherit" letter-spacing="0.05em">CAPACITY</text>
      <text x="${cx}" y="${numY}" font-size="${big?21:16}" fill="#c2860a" text-anchor="middle" font-weight="800" font-family="inherit">${capacity}</text>`;
  }
  if(preference!==null){
    const m = byKey.preference;
    const trueX = m.x, markerY = m.cy;
    const cx = Math.max(padX+44, Math.min(w-padX-44, trueX));
    const numY = big ? 168 : 122, labelY = big ? 188 : 138, leaderEndY = big ? 153 : 110;
    const leader = markerY!==trackY ? `<line x1="${trueX}" y1="${trackY}" x2="${trueX}" y2="${markerY}" stroke="#2f6fed" stroke-width="1" opacity="0.45"/>` : '';
    preferenceGroup = `
      ${leader}
      <line x1="${trueX}" y1="${markerY+9}" x2="${cx}" y2="${leaderEndY}" stroke="#2f6fed" stroke-width="1" stroke-dasharray="2 2" opacity="0.6"/>
      <circle cx="${trueX}" cy="${markerY}" r="${big?7:5.5}" fill="#2f6fed" stroke="#fff" stroke-width="2"/>
      <text x="${cx}" y="${numY}" font-size="${big?21:16}" fill="#2f6fed" text-anchor="middle" font-weight="800" font-family="inherit">${preference}</text>
      <text x="${cx}" y="${labelY}" font-size="${big?11.5:9}" fill="#2f6fed" text-anchor="middle" font-weight="700" font-family="inherit" letter-spacing="0.05em">PREFERENCE</text>`;
  }

  // Current / Proposed / Required render as small pins directly on the track —
  // the number lives inside the badge itself, so there's no external text box
  // to fight for space. A legend below explains the colors.
  const pins = trackMarkers.filter(m => m.kind==='diamond' || m.kind==='circle');
  const pinShapes = pins.map(p=>{
    const leader = p.cy!==trackY ? `<line x1="${p.x}" y1="${trackY}" x2="${p.x}" y2="${p.cy}" stroke="${p.stroke||p.fill}" stroke-width="1" opacity="0.45"/>` : '';
    let shape;
    if(p.kind==='diamond'){
      const s=p.r;
      shape = `<path d="M ${p.x} ${p.cy-s} L ${p.x+s} ${p.cy} L ${p.x} ${p.cy+s} L ${p.x-s} ${p.cy} Z" fill="${p.fill}"/>
        <text x="${p.x}" y="${p.cy}" font-size="${big?9:7}" fill="${p.textColor}" text-anchor="middle" dy="3" font-weight="700" font-family="inherit">${p.value}</text>`;
    } else {
      shape = `<circle cx="${p.x}" cy="${p.cy}" r="${p.r}" fill="${p.fill}" stroke="${p.stroke||'#fff'}" stroke-width="${p.stroke?2.5:2}"/>
        <text x="${p.x}" y="${p.cy}" font-size="${big?11:9}" fill="${p.textColor}" text-anchor="middle" dy="4" font-weight="700" font-family="inherit">${p.value}</text>`;
    }
    return leader + shape;
  }).join('');

  // Legend row along the bottom — precisely centered using the real measured
  // text width of each label rather than an estimate.
  const legendItems = [];
  if(capacity!==null) legendItems.push({label:'Capacity', color:'#c2860a', shape:'diamond'});
  if(preference!==null) legendItems.push({label:'Preference', color:'#2f6fed', shape:'circle'});
  if(pins.find(p=>p.key==='current')) legendItems.push({label:'Current', color:'#0e1a2b', shape:'circle'});
  if(pins.find(p=>p.key==='proposed')) legendItems.push({label:'Proposed', color:'#177350', shape:'ring'});
  if(pins.find(p=>p.key==='required')) legendItems.push({label:'Required', color:'#8B5CF6', shape:'diamond'});
  const legendFont = big ? 11.5 : 9.5;
  const swatchGap = 6, itemGap = big ? 20 : 14, swatchSize = big ? 10 : 8;
  const itemWidths = legendItems.map(it => swatchSize + swatchGap + measureTextWidth(it.label, legendFont, 600));
  const totalLegendW = itemWidths.reduce((s,x)=>s+x,0) + itemGap*(legendItems.length-1);
  let lx = (w - totalLegendW)/2;
  const legendY = big ? 214 : 158;
  const legend = legendItems.map((it,i)=>{
    const sw = it.shape==='diamond'
      ? `<path d="M ${lx+swatchSize/2} ${legendY-swatchSize/2} L ${lx+swatchSize} ${legendY} L ${lx+swatchSize/2} ${legendY+swatchSize/2} L ${lx} ${legendY} Z" fill="${it.color}"/>`
      : it.shape==='ring'
      ? `<circle cx="${lx+swatchSize/2}" cy="${legendY}" r="${swatchSize/2}" fill="#fff" stroke="${it.color}" stroke-width="2"/>`
      : `<circle cx="${lx+swatchSize/2}" cy="${legendY}" r="${swatchSize/2}" fill="${it.color}"/>`;
    const txt = `<text x="${lx+swatchSize+swatchGap}" y="${legendY}" font-size="${legendFont}" fill="#5b6b82" dy="3.5" font-weight="600" font-family="inherit">${it.label}</text>`;
    lx += itemWidths[i] + itemGap;
    return sw + txt;
  }).join('');

  return `<svg width="100%" viewBox="0 0 ${w} ${h}" style="display:block;">
    <rect x="${padX}" y="${trackY-5}" width="${trackW}" height="10" rx="5" fill="#eef1f6"/>
    ${band}
    ${ticks}
    ${capacityGroup}
    ${preferenceGroup}
    ${pinShapes}
    ${legend}
  </svg>`;
}

function inBand(score, capacity, preference){
  if(score===null || capacity===null || preference===null) return null;
  const lo = Math.min(capacity, preference), hi = Math.max(capacity, preference);
  return score >= lo && score <= hi;
}

function renderClientList(){
  clients = clients.map(migrateClient);
  const q = (clientSearchQuery||'').trim().toLowerCase();
  const filtered = q ? clients.filter(c=>{
    const name = `${c.client1.first} ${c.client1.last} ${c.client2.first} ${c.client2.last}`.toLowerCase();
    return name.includes(q);
  }) : clients;

  // The separate scrollable client list (with a risk-band status dot per
  // client) used to render right below this dropdown — visually indistinguishable
  // from "a dropdown that's also somehow a list," which is exactly the reported
  // confusion. Removed in favor of the dropdown alone; the search box above now
  // filters the dropdown's own options live instead of a list that no longer
  // exists, so typing a name still narrows things down the same way it used to.
  const dd = document.getElementById('clientDropdown');
  if(dd){
    const sorted = [...filtered].sort((a,b)=>{
      const na = (a.client1.first || a.client1.last) ? `${a.client1.first} ${a.client1.last}`.trim() : 'New client';
      const nb = (b.client1.first || b.client1.last) ? `${b.client1.first} ${b.client1.last}`.trim() : 'New client';
      return na.localeCompare(nb);
    });
    dd.innerHTML = `<option value="">Jump to client…</option>` + sorted.map(c=>{
      const name = (c.client1.first || c.client1.last) ? `${c.client1.first} ${c.client1.last}`.trim() : 'New client';
      return `<option value="${attrEsc(c.id)}" ${c.id===activeId?'selected':''}>${name}</option>`;
    }).join('');
  }
}

// ---------- PRACTICE DASHBOARD ----------
function dashboardViewHTML(){
  const rows = clients.map(c=>{
    const cap = riskCapacityScore(c), pref = riskPreferenceScore(c), ps = portfolioScore(c);
    const band = (ps!==null && cap!==null && pref!==null) ? inBand(ps, cap, pref) : null;
    const daysSince = c.reviewDate ? Math.floor((Date.now() - new Date(c.reviewDate).getTime()) / 86400000) : null;
    return {c, band, daysSince};
  });

  const outOfBand = rows.filter(r=>r.band===false).length;
  const staleReviews = rows.filter(r=>r.daysSince===null || r.daysSince>365).length;
  const totalClients = clients.length;

  const sorted = rows.slice().sort((a,b)=>{
    const av = a.daysSince===null ? 99999 : a.daysSince;
    const bv = b.daysSince===null ? 99999 : b.daysSince;
    return bv - av;
  });

  const tableRows = sorted.map(({c, band, daysSince})=>{
    const name = (c.client1.first || c.client1.last) ? `${c.client1.first} ${c.client1.last}`.trim() : 'New client';
    const reviewLabel = daysSince===null ? 'Never reviewed' : `${daysSince} days ago`;
    // Never-reviewed is a neutral "hasn't happened yet" state, not the same as a lapsed review — only
    // flag red once there's an actual prior review that's now stale, so a brand-new client doesn't
    // read as "overdue" the moment they're created.
    const reviewFlag = daysSince===null ? 'warn' : daysSince>365 ? 'err' : daysSince>270 ? 'warn' : 'ok';
    const bandFlag = band===null ? '' : band ? '<span class="flag ok">In band</span>' : '<span class="flag err">Out of band</span>';
    return `<tr>
      <td>${name}</td>
      <td><span class="flag ${reviewFlag}">${reviewLabel}</span></td>
      <td>${bandFlag}</td>
      <td><button class="btn ghost" onclick="selectClient('${c.id}')">Open</button></td>
    </tr>`;
  }).join('');

  return `
    <h1>Practice Dashboard</h1>
    <p class="sub">Everything at a glance — no clicking into each client to find out what needs attention.</p>
    <div class="summary-cards">
      <div class="scard"><div class="label">Total clients</div><div class="value">${totalClients}</div></div>
      <div class="scard ${outOfBand?'bad':'good'}"><div class="label">Out of risk band</div><div class="value">${outOfBand}</div></div>
      <div class="scard ${staleReviews?'warn':'good'}"><div class="label">Needs Review</div><div class="value">${staleReviews}</div></div>
      <div class="scard"><div class="label">Pending submissions</div><div class="value" id="dashPendingValue">${pendingCount}</div></div>
    </div>
    <div class="panel">
      <h2>Clients — sorted by review staleness</h2>
      ${totalClients ? `<table>
        <thead><tr><th>Client</th><th>Last review</th><th>Risk band</th><th></th></tr></thead>
        <tbody>${tableRows}</tbody>
      </table>` : '<div class="empty">No clients yet.</div>'}
    </div>
    <footer class="tool-foot">Redmount Capital Partners — internal use</footer>
  `;
}

function bulkAddSecurities(){
  const raw = document.getElementById('bulkPaste').value;
  const lines = raw.trim().split(/\r?\n/).filter(l=>l.trim());
  let added = 0, updated = 0, skipped = 0;
  const validClasses = ASSET_CLASSES.map(a=>a.key);
  lines.forEach(line=>{
    const parts = line.split(',').map(p=>p.trim());
    if(parts.length < 4){ skipped++; return; }
    const [tickerRaw, name, assetClassRaw, scoreRaw, erRaw] = parts;
    const ticker = tickerRaw.toUpperCase();
    const assetClass = validClasses.includes(assetClassRaw) ? assetClassRaw : 'us_large';
    const score = Math.max(0, Math.min(100, parseFloat(scoreRaw) || 0));
    const expenseRatio = erRaw!==undefined ? Math.max(0, parseFloat(erRaw)||0) : 0;
    if(!ticker){ skipped++; return; }
    const existing = securityLibrary.find(s=>s.ticker===ticker);
    if(existing){
      existing.name = name; existing.assetClass = assetClass; existing.score = score; existing.expenseRatio = expenseRatio;
      updated++;
    } else {
      securityLibrary.push({ticker, name, assetClass, score, expenseRatio});
      added++;
    }
  });
  document.getElementById('bulkStatus').textContent = `${added} added, ${updated} updated${skipped?`, ${skipped} skipped (bad format)`:''}.`;
  document.getElementById('bulkPaste').value = '';
  renderMain();
}

function addSecurity(){
  securityLibrary.push({ticker:'', name:'', assetClass:'us_large', score:50, expenseRatio:0});
  renderMain();
}
function removeSecurity(idx){
  securityLibrary.splice(idx,1);
  renderMain();
}
function updateSecurity(idx, field, val){
  if(field==='ticker') val = val.trim().toUpperCase();
  if(field==='score') val = Math.max(0, Math.min(100, parseFloat(val)||0));
  if(field==='expenseRatio') val = Math.max(0, parseFloat(val)||0);
  securityLibrary[idx][field] = val;
  renderMain();
}
function exportLibrary(){
  const blob = new Blob([JSON.stringify(securityLibrary, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'redmount-security-library.json';
  a.click();
  URL.revokeObjectURL(url);
}
function importLibrary(event){
  const file = event.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = e=>{
    try{
      const imported = JSON.parse(e.target.result);
      if(Array.isArray(imported)){ securityLibrary = imported; renderMain(); }
    }catch(err){ alert('Could not read that file.'); }
  };
  reader.readAsText(file);
}

function holdingWarnings(holdings){
  const warnings = {};
  const seen = {};
  holdings.forEach((h,i)=>{
    const val = parseFloat(h.value);
    const msgs = [];
    if(!h.value || isNaN(val) || val<=0) msgs.push('No positive value entered');
    if(h.ticker){
      const t = h.ticker.trim().toUpperCase();
      if(t){ seen[t] = seen[t] || []; seen[t].push(i); }
    }
    if(msgs.length) warnings[i] = msgs;
  });
  Object.values(seen).forEach(idxs=>{
    if(idxs.length>1) idxs.forEach(i=>{ warnings[i] = (warnings[i]||[]).concat('Duplicate ticker in this list'); });
  });
  return warnings;
}

function warningBadgeHTML(msgs){
  if(!msgs || !msgs.length) return '';
  return `<span class="flag warn" style="margin-left:6px;" title="${msgs.join('; ')}">⚠ ${msgs[0]}</span>`;
}

// Entry point for the new toolbar button — unlike the Review History flow,
// this doesn't require a full risk assessment or an existing snapshot. It
// works off whatever data the client currently has, sparse or complete
// (buildClientPDF already renders "—" for anything missing, verified
// separately). A snapshot still gets created behind the scenes — that's
// what the Edge Function/webhook needs to know which record to update when
// the signature comes back — but the button itself makes no assumptions
// about what's been filled in first.
async function sendClientForSignature(cid){
  const c = getClient(cid);
  if(!c) return;
