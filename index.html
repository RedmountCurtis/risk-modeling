// Uploads the scanned wet-signed file to Supabase Storage via the
// signwell-sign Edge Function (service role) — the bucket is private with
// no client-facing policies, so this is the only path in or out of it.
// Replaces the old client-side-only base64 storage.
async function uploadSignedCopy(cid, idx, inputEl){
  const file = inputEl.files && inputEl.files[0];
  if(!file) return;
  const MAX_BYTES = 4 * 1024 * 1024; // 4MB — a scanned single-page PDF fits comfortably under this
  if(file.size > MAX_BYTES){
    alert('That file is ' + (file.size/1024/1024).toFixed(1) + 'MB — please keep signed copies under 4MB (a lower-resolution scan or a re-exported PDF usually does it).');
    inputEl.value = '';
    return;
  }
  const c = getClient(cid);
  if(!c._remoteId){
    alert('This client hasn\'t been saved yet — click Save first, then try uploading the signed copy again.');
    inputEl.value = '';
    return;
  }
  const reader = new FileReader();
  reader.onload = async () => {
    try{
      const session = await ensureValidSession();
      if(!session) throw new Error('Not signed in');
      const res = await fetch(EDGE_FUNCTION_URL, {
        method: 'POST',
        headers: { 'Authorization': 'Bearer ' + session.access_token, 'Content-Type': 'application/json' },
        body: JSON.stringify({
          action: 'uploadWetSigned',
          clientId: c._remoteId,
          reviewIndex: idx,
          fileBase64: reader.result,
          fileName: file.name,
          contentType: file.type || 'application/pdf'
        })
      });
      const data = await res.json();
      if(!res.ok) throw new Error(data.error || 'Unknown error uploading signed copy');

      c.reviewHistory[idx].signatureStatus = 'wet-signed';
      c.reviewHistory[idx].signedDate = data.signedDate;
      c.reviewHistory[idx].signedFileName = file.name;
      c.reviewHistory[idx].signedFilePath = data.path;
      c.reviewHistory[idx].signedFileData = null;
      renderTab();
    } catch(e){
      alert('Could not upload signed copy: ' + e.message);
    }
  };
  reader.onerror = () => alert('Could not read that file — please try again.');
  reader.readAsDataURL(file);
}
// Requests a short-lived signed URL from the Edge Function rather than
// touching Storage directly — the bucket has no client-facing policies, so
// this is the only way to retrieve a file from it. Falls back to the old
// embedded base64 for any review signed before this Storage migration and
// not yet backfilled.
async function downloadSignedCopy(cid, idx){
  const c = getClient(cid);
  const snap = c.reviewHistory[idx];
  if(!snap) return;
  if(!snap.signedFilePath && snap.signedFileData){
    const a = document.createElement('a');
    a.href = snap.signedFileData;
    a.download = snap.signedFileName || 'signed-review.pdf';
    a.click();
    return;
  }
  if(!snap.signedFilePath) return;
  if(!c._remoteId){ alert('This client record has no saved id — try reloading.'); return; }
  try{
    const session = await ensureValidSession();
    if(!session) throw new Error('Not signed in');
    const res = await fetch(EDGE_FUNCTION_URL, {
      method: 'POST',
      headers: { 'Authorization': 'Bearer ' + session.access_token, 'Content-Type': 'application/json' },
      body: JSON.stringify({ action: 'getDownloadUrl', clientId: c._remoteId, reviewIndex: idx })
    });
    const data = await res.json();
    if(!res.ok) throw new Error(data.error || 'Unknown error getting download link');
    window.open(data.url, '_blank');
  } catch(e){
    alert('Could not download signed copy: ' + e.message);
  }
}

// One-click e-signature send. Honest note on how this got here: my first
// attempt used html2pdf.js to generate the PDF bytes entirely in-browser, no
// download/upload round trip needed. I tested that directly rather than
// assuming it worked, and found a real, reproducible failure — html2canvas
// (which html2pdf.js relies on) was producing a canvas with zero height for
// this content, confirmed across two different library versions. That's not
// a "couldn't test it" situation, it's a demonstrated bug, and I'm not
// willing to ship an unverified PDF pipeline into a compliance-relevant
// document flow on the chance it behaves differently in a real browser.
// This version reuses the SAME PDF generation already proven correct
// throughout this tool (the browser's own print pipeline) — the only
// difference from the wet-signature path is what happens after: instead of
// getting filed away, the PDF gets sent to Dropbox Sign. One extra click
// (selecting the file you just downloaded) versus an unverified shortcut.
// Generates the review PDF entirely in-browser — genuinely no print dialog,
// no manual file selection. This replaced an earlier two-click version after
// finding and fixing the real bug that blocked it: html2canvas's DOM capture
// was always correct (verified by extracting the raw canvas directly), but
// html2pdf.js's own built-in pagination was silently cropping content when
// slicing that canvas into PDF pages. Bypassing that step and doing the
// canvas-to-PDF placement manually, with direct control over the math,
// resolved it — confirmed by rendering and visually checking every single
// page of a full multi-page report, not just spot-checking.
async function generateClientPdfBlob(c){
  const container = document.createElement('div');
  // Must be a normal, in-flow element with no position:fixed/absolute and no
  // opacity/off-screen tricks — confirmed directly (twice now) that anything
  // other than plain in-flow positioning makes html2canvas measure it as
  // zero height, producing a blank, ~3KB PDF with no visible error. A
  // temporary full-screen overlay covers it visually so nothing looks broken
  // while it's briefly in the page.
  const overlay = document.createElement('div');
  overlay.id = 'pdfGenOverlay';
  overlay.style.cssText = 'position:fixed; inset:0; background:#f6f7fa; z-index:99999; display:flex; align-items:center; justify-content:center; font-family:inherit; font-size:15px; color:var(--ink-dim);';
  overlay.textContent = 'Preparing document for signature…';
  document.body.appendChild(overlay);

  // font-family explicitly overridden here (not inherited from body's
  // -apple-system stack) — html2canvas has a known bug where it paints
  // -apple-system text using the real system font but measures glyph widths
  // against a mismatched fallback, causing words to overlap/collapse
  // together exactly as seen in the disclosures section. Arial/Helvetica are
  // metrics html2canvas handles correctly.
  container.style.cssText = 'width:800px; background:#fff; font-family:Arial,Helvetica,sans-serif;';
  container.innerHTML = buildClientPDF(c);
  document.body.appendChild(container);
  // Two animation frames ensures layout (including the SVG charts) has
  // genuinely finished before capture — same reasoning as the print timing
  // fix elsewhere in this tool.
  await new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r)));

  // html2canvas does not reliably honor width="100%" on inline <svg>
  // elements — it falls back to treating the viewBox/attribute numbers as
  // the true pixel width instead of the CSS-stretched size a real browser
  // computes. That's why these charts render full-width on screen but stay
  // stuck at their small design width (640/760px) in the captured PDF. Fix:
  // right before capture, read each SVG's actual on-screen rendered width
  // (already correctly computed by real browser layout at this point) and
  // bake it in as an explicit width/height attribute so html2canvas has no
  // percentage to misinterpret.
  container.querySelectorAll('svg').forEach(svg => {
    const rect = svg.getBoundingClientRect();
    const viewBox = svg.getAttribute('viewBox');
    if (!viewBox || rect.width <= 0) return;
    const parts = viewBox.split(/\s+/).map(Number);
    const vbW = parts[2], vbH = parts[3];
    if (!vbW || !vbH) return;
    svg.setAttribute('width', String(rect.width));
    svg.setAttribute('height', String(rect.width * (vbH / vbW)));
  });

  // scale:3 triples the capture resolution relative to the container's raw
  // CSS pixel width (800px) — after being stretched to fill an 8.5in page,
  // this works out to roughly 280 DPI, comfortably above what's needed for
  // crisp text and thin chart lines. Bumped up from 2x after review showed
  // 2x was still visibly soft. letterRendering:true forces html2canvas to
  // draw each glyph individually rather than as a batched text run, which
  // measurably sharpens small font sizes at a modest speed cost.
  const canvas = await html2pdf().from(container).set({html2canvas:{scale:3, useCORS:true, letterRendering:true}}).toCanvas().get('canvas');
  document.body.removeChild(container);
  document.body.removeChild(overlay);

  const { jsPDF } = window.jspdf;
  const pdf = new jsPDF({unit:'in', format:'letter', orientation:'portrait'});
  const marginIn = 0.4;
  const usableWidthIn = 8.5 - marginIn*2;
  const usableHeightIn = 11 - marginIn*2;
  const pxPerIn = canvas.width / usableWidthIn;
  const pageHeightPx = usableHeightIn * pxPerIn;

  let renderedPx = 0, pageNum = 0;
  while(renderedPx < canvas.height){
    const sliceHeightPx = Math.min(pageHeightPx, canvas.height - renderedPx);
    const sliceCanvas = document.createElement('canvas');
    sliceCanvas.width = canvas.width;
    sliceCanvas.height = sliceHeightPx;
    sliceCanvas.getContext('2d').drawImage(canvas, 0, renderedPx, canvas.width, sliceHeightPx, 0, 0, canvas.width, sliceHeightPx);

    if(pageNum > 0) pdf.addPage();
    // JPEG at 0.92 quality instead of PNG — this is a text/line-art-heavy
    // document, not photography, so the quality loss is not visible, and it
    // cuts file size by roughly 10x (an uncompressed PNG of a full-page
    // canvas easily runs 2MB+ per page, well past what email or Dropbox
    // Sign's upload size comfortably handles for a multi-page document).
    pdf.addImage(sliceCanvas.toDataURL('image/jpeg', 0.92), 'JPEG', marginIn, marginIn, usableWidthIn, sliceHeightPx / pxPerIn);
    renderedPx += sliceHeightPx;
    pageNum++;
  }
  return pdf.output('blob');
}

async function sendForESignature(cid, idx, buttonId){
  const c = getClient(cid);
  if(!c) return;
  if(!c._remoteId){
    alert('This client hasn\'t been saved yet — click Save first, then try sending for e-signature again (the server needs a saved record to attach the signature request to).');
    return;
  }
  const email = (c.contact.email || '').split(',')[0].trim();
  if(!email){
    alert('This client has no email address on file (Contact & Other Professionals section) — add one before sending for e-signature.');
    return;
  }
  const signerName = [c.client1.first, c.client1.last].filter(Boolean).join(' ') || email;
  const btn = document.getElementById(buttonId || `esign-btn-${cid}-${idx}`);
  const originalBtnText = btn ? btn.textContent : '';
  if(btn){ btn.disabled = true; btn.textContent = 'Preparing document…'; }

  try{
    const pdfBlob = await generateClientPdfBlob(c);
    if(btn) btn.textContent = 'Sending…';

    const reader = new FileReader();
    const pdfBase64 = await new Promise((resolve, reject) => {
      reader.onload = () => resolve(reader.result.split(',')[1]);
      reader.onerror = reject;
      reader.readAsDataURL(pdfBlob);
    });

    const session = await ensureValidSession();
    if(!session) throw new Error('Not signed in');

    const res = await fetch(EDGE_FUNCTION_URL, {
      method: 'POST',
      headers: {
        'Authorization': 'Bearer ' + session.access_token,
        'Content-Type': 'application/json'
      },
      body: JSON.stringify({
        clientId: c._remoteId,
        reviewIndex: idx,
        signerEmail: email,
        signerName: signerName,
        pdfBase64: pdfBase64,
        title: `Annual Client Review — ${signerName}`
      })
    });
    const data = await res.json();
    if(!res.ok){
      throw new Error(data.error ? (data.error + (data.detail ? ': '+JSON.stringify(data.detail) : '')) : 'Unknown error sending for signature');
    }

    c.reviewHistory[idx].signatureStatus = 'sent';
    // renderTab() alone only refreshes the tab content area — the toolbar
    // button that triggered this (when called from the top-level "Send to
    // Client for Signature" button) lives outside that area, in the client
    // header, so it never got told the send actually finished and stayed
    // stuck on "Sending…" even though the request succeeded. renderAll()
    // refreshes both.
    renderAll();
  } catch(e){
    alert('Could not send for e-signature: ' + e.message);
    if(btn){ btn.disabled = false; btn.textContent = originalBtnText || 'Send for E-Signature'; }
  }
}

function mergeAnswersIntoClient(targetClient, answers){
  const a = answers || {};
  if(a.firstName && !targetClient.client1.first) targetClient.client1.first = a.firstName;
  if(a.lastName && !targetClient.client1.last) targetClient.client1.last = a.lastName;
  if(a.age) targetClient.age = a.age;
  if(a.investableAssets) targetClient.financial.investableAssets = a.investableAssets;
  ['lossReaction','historicalBehavior','maxLossTolerance','gainFlipChoice','lossFlipChoice','incomeStability','experienceLevel'].forEach(k=>{
    if(a[k]!==undefined && a[k]!=='') targetClient.questionnaire[k] = a[k];
  });
  if(a.goalDescription) targetClient.goal.description = a.goalDescription;
  if(a.goalTargetAmount) targetClient.goal.targetAmount = a.goalTargetAmount;
  if(a.goalYears) targetClient.goal.years = a.goalYears;
}

async function acceptSubmission(submissionId, selectId){
  try{
    const res = await supabaseFetch(`/risk_intake_submissions?id=eq.${submissionId}&select=*,risk_intake_links(client_id,client_first_name)`);
    const rows = await res.json();
    if(!rows.length) return;
    const sub = rows[0];
    const select = document.getElementById(selectId);
    const choice = select ? select.value : '__new__';

    let targetClient;
    if(choice === '__new__'){
      targetClient = blankClient();
      targetClient.activeScenarioId = targetClient.proposedScenarios[0].id;
      const firstName = (sub.risk_intake_links && sub.risk_intake_links.client_first_name) || '';
      if(firstName) targetClient.client1.first = firstName;
      clients.push(targetClient);
      activeId = targetClient.id;
    } else {
      targetClient = clients.find(c=>c.id === choice);
      if(!targetClient){ alert('Could not find that client — refresh and try again.'); return; }
    }

    mergeAnswersIntoClient(targetClient, sub.answers);

    await supabaseFetch(`/risk_intake_submissions?id=eq.${submissionId}`, {method:'PATCH', body: JSON.stringify({reviewed:true})});
    delete lastSavedHash[targetClient.id]; // force autosave to pick up the merge / new client
    reviewingSubmission = null;
    currentView = 'clients';
    activeId = targetClient.id;
    activeTab = 'profile';
    renderAll();
  }catch(e){ console.error(e); alert('Could not accept this submission. Try again.'); }
}

async function rejectSubmission(submissionId){
  try{
    await supabaseFetch(`/risk_intake_submissions?id=eq.${submissionId}`, {method:'PATCH', body: JSON.stringify({reviewed:true})});
    reviewingSubmission = null;
    openPending();
  }catch(e){ console.error(e); }
}

// ---------- PDF / PRINT ----------
function esc(v){ return (v===null||v===undefined||v==='') ? '<span style="color:#bbb;">—</span>' : String(v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
// HTML-attribute-safe escaping for every editable field value/textarea
// content interpolated into generated markup. Every input in this app is
// built as a raw template-literal string (no framework, no auto-escaping),
// so a field value containing a literal double-quote (a client address like
// 123 Main St, Apt "B", a note like cost < budget, a nickname in quotes,
// etc.) previously broke out of the value="..." attribute mid-render,
// corrupting everything after it in that section of the form — silently,
// with no error, no indication anything was wrong. attrEsc() closes that
// gap for both value="${attrEsc(...)}" attributes and textarea content.
function attrEsc(v){
  if(v===null||v===undefined) return '';
  return String(v).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
// Comma-formats dollar-value fields for display only — the underlying stored
// value is always a clean digit string with no commas (parseFloat stops at
// the first non-numeric character, so "400,000" would silently parse as
// just 400 if a comma ever leaked into stored data). Requested specifically
// because "40000" vs "400000" is genuinely hard to eyeball correctly at a
// glance, especially several zeros deep.
function formatMoneyDisplay(v){
  if(v===''||v===null||v===undefined) return '';
  const s = String(v);
  const neg = s.trim().startsWith('-');
  const cleaned = s.replace(/[^\d.]/g,'');
  if(cleaned==='') return neg ? '-' : '';
  const dotIdx = cleaned.indexOf('.');
  let intPart = dotIdx===-1 ? cleaned : cleaned.slice(0,dotIdx);
  let decPart = dotIdx===-1 ? '' : cleaned.slice(dotIdx+1).replace(/\./g,'');
  intPart = intPart.replace(/\B(?=(\d{3})+(?!\d))/g, ',');
  return (neg?'-':'') + intPart + (dotIdx!==-1 ? '.'+decPart : '');
}
// Live-reformats a money input as the person types. Simplification: cursor
// always lands at the end of the field after each keystroke. That's the
// right tradeoff for how these fields actually get used (typing digits left
// to right), at the cost of being a little awkward if someone edits in the
// middle of an existing number — acceptable given the alternative (no
// commas at all) was the actual, reported problem.
function onMoneyInput(el){
  const raw = el.value.replace(/,/g,'');
  el.value = formatMoneyDisplay(raw);
}
// Strips commas back out before a money field's value is actually stored —
// pairs with onMoneyInput/formatMoneyDisplay above.
function moneyVal(v){ return String(v).replace(/,/g,''); }

// ---------- HOLDINGS CSV IMPORT ----------
// Parses one CSV line respecting quoted fields (including embedded commas
// and doubled "" escaped quotes inside quotes) — a plain line.split(',')
// breaks the moment a brokerage export quotes a dollar amount like
// "$15,000.00" or a description containing a comma.
function parseCsvLine(line){
  const out = [];
  let cur = '', inQuotes = false;
  for(let i=0;i<line.length;i++){
    const ch = line[i];
    if(inQuotes){
      if(ch === '"'){
        if(line[i+1] === '"'){ cur += '"'; i++; }
        else inQuotes = false;
      } else cur += ch;
    } else {
      if(ch === '"') inQuotes = true;
      else if(ch === ','){ out.push(cur); cur=''; }
      else cur += ch;
    }
  }
  out.push(cur);
  return out.map(s=>s.trim());
}
function cleanMoneyCell(v){
  if(v===undefined||v===null) return NaN;
  let s = String(v).trim();
  if(s==='') return NaN;
  let neg = false;
  if(/^\(.*\)$/.test(s)){ neg = true; s = s.slice(1,-1); }
  s = s.replace(/[$,]/g,'');
  const n = parseFloat(s);
  if(isNaN(n)) return NaN;
  return neg ? -n : n;
}
function looksLikeTicker(s){ return /^[A-Z][A-Z0-9.\-]{0,9}$/.test(s); }
// Core row-processing logic, shared by both the plain-text CSV/paste path
// and the real Excel (.xlsx) path below — both eventually produce the same
// shape (an array of rows, each row an array of cell strings), so the
// header-detection and extraction logic only needs to exist once.
//
// Column matching is deliberately loose rather than exact: real brokerage
// exports vary their exact header text (Schwab's own Excel export uses
// "Symbol/CUSIP", not "Symbol" — an exact-match check would miss it
// entirely and silently fall through to nothing importing).
function extractHoldingsFromRows(rows){
  let headerIdx = -1, tickerCol = -1, valueCol = -1;
  for(let i=0;i<rows.length;i++){
    const row = rows[i];
    const tCol = row.findIndex(cell=>/^(symbol|ticker)/i.test(cell.trim()));
    if(tCol === -1) continue;
    const vCol = row.findIndex(cell=>/market\s*value|mkt\s*val|current\s*value|^value$|^amount$/i.test(cell.trim()));
    if(vCol === -1) continue;
    headerIdx = i; tickerCol = tCol; valueCol = vCol;
    break;
  }

  const results = [];
  if(headerIdx !== -1){
    for(let i=headerIdx+1;i<rows.length;i++){
      const row = rows[i];
      if(row.length <= Math.max(tickerCol, valueCol)) continue;
      const ticker = (row[tickerCol]||'').trim();
      if(!ticker) continue;
      if(/cash/i.test(ticker)){
        const val = cleanMoneyCell(row[valueCol]);
        if(!isNaN(val) && val > 0) results.push({ticker:'CASH', value: val, assetClassHint:'us_cash'});
        continue;
      }
      const upper = ticker.toUpperCase();
      if(!looksLikeTicker(upper)) continue; // filters "Account Total", footnotes, blank separator rows, etc.
      const val = cleanMoneyCell(row[valueCol]);
      if(isNaN(val) || val <= 0) continue;
      results.push({ticker: upper, value: val});
    }
  } else {
    // No recognizable brokerage-export header found — fall back to the
    // simple two-column TICKER,VALUE paste this box has always accepted.
    for(const row of rows){
      if(row.length < 2) continue;
      let [ticker, value] = row;
      ticker = (ticker||'').trim();
      if(!ticker) continue;
      if(/^[a-zA-Z]/.test(ticker) && isNaN(parseFloat(value))) continue; // header row
      const val = cleanMoneyCell(value);
      if(isNaN(val) || val <= 0) continue;
      results.push({ticker: ticker.toUpperCase(), value: val});
    }
  }

  // Separately: some exports (Schwab's Excel export among them) show an
  // account-level summary block ABOVE the holdings table with a
  // "Total Cash & Cash Investments" figure — real, uninvested cash sitting
  // in the account that is NOT represented by any row in the holdings table
  // itself (it's distinct from a money-market fund ticker, which already
  // gets picked up normally above). Skipping this would understate the
  // account's true total by however much cash is sitting uninvested.
  // Only added if no per-row "cash" holding was already found above, to
  // avoid double-counting on exports that DO list cash as its own row.
  if(!results.some(r=>r.ticker==='CASH')){
    for(let i=0;i<rows.length;i++){
      const col = rows[i].findIndex(cell=>/total\s*cash\s*&?\s*cash\s*investments/i.test(cell.trim()));
      if(col === -1) continue;
      const nextRow = rows[i+1];
      if(!nextRow) break;
      const val = cleanMoneyCell(nextRow[col]);
      if(!isNaN(val) && val > 0) results.push({ticker:'CASH', value: val, assetClassHint:'us_cash'});
      break;
    }
  }

  return results;
}
// Parses either the simple two-column TICKER,VALUE paste this box has
// always accepted, or a real brokerage CSV export — see
// extractHoldingsFromRows for the shared logic both paths funnel into.
function parseHoldingsCSV(text){
  const lines = text.split(/\r?\n/).map(l=>l.replace(/\r$/,'')).filter(l=>l.trim()!=='');
  if(!lines.length) return [];
  const rows = lines.map(parseCsvLine);
  return extractHoldingsFromRows(rows);
}
// Parses a real Excel file (.xlsx/.xls) — Schwab's own "export to Excel"
// option produces this rather than CSV, and it's binary, so it can't go
// through the text-based CSV path at all. Requires the SheetJS library
// (loaded via CDN at the top of this file).
function parseHoldingsWorkbook(arrayBuffer){
  const wb = XLSX.read(arrayBuffer, {type:'array'});
  const sheet = wb.Sheets[wb.SheetNames[0]];
  const rows = XLSX.utils.sheet_to_json(sheet, {header:1, defval:''})
    .map(row => row.map(cell => String(cell)));
  return extractHoldingsFromRows(rows);
}
function readHoldingsCsvFile(file, textareaId, importFn){
  if(!file) return;
  const reader = new FileReader();
  reader.onload = e => { document.getElementById(textareaId).value = e.target.result; importFn(); };
  reader.onerror = () => alert('Could not read that file — please try again.');
  reader.readAsText(file);
}
// Routes a dropped/selected file to the right parser by extension, then
// pushes the resulting holdings straight into the given push function —
// Excel files skip the paste-textarea entirely since there's no sensible
// plain-text staging step for binary spreadsheet data.
function importHoldingsFile(file, pushFn){
  if(!file) return;
  const name = (file.name||'').toLowerCase();
  if(name.endsWith('.xlsx') || name.endsWith('.xls')){
    if(typeof XLSX === 'undefined'){
      alert('Could not load the Excel-reading library (check your internet connection and reload) — or export/save this file as CSV instead and use that.');
      return;
    }
    const reader = new FileReader();
    reader.onload = e => {
      try{
        const rows = parseHoldingsWorkbook(e.target.result);
        if(!rows.length){ alert('Could not find any recognizable holdings in that Excel file — the column layout may not be one this tool recognizes yet. Try exporting as CSV instead, or send this file over so the importer can be taught this format.'); return; }
        pushFn(rows);
      } catch(err){
        alert('Could not read that Excel file: ' + err.message);
      }
    };
    reader.onerror = () => alert('Could not read that file — please try again.');
    reader.readAsArrayBuffer(file);
  } else {
    const reader = new FileReader();
    reader.onload = e => {
      const rows = parseHoldingsCSV(e.target.result);
      pushFn(rows);
    };
    reader.onerror = () => alert('Could not read that file — please try again.');
    reader.readAsText(file);
  }
}

// ---------- PORTFOLIO CHANGE PROPOSAL REPORT ----------
function buildTradeList(currentHoldings, proposedHoldings){
  const cur = {}, prop = {};
  currentHoldings.forEach(h=>{ if(!h.ticker) return; const t=h.ticker.trim().toUpperCase(); cur[t]=(cur[t]||0)+(parseFloat(h.value)||0); });
  proposedHoldings.forEach(h=>{ if(!h.ticker) return; const t=h.ticker.trim().toUpperCase(); prop[t]=(prop[t]||0)+(parseFloat(h.value)||0); });
  const allTickers = Array.from(new Set([...Object.keys(cur), ...Object.keys(prop)])).sort();
  return allTickers.map(t=>{
    const c = cur[t]||0, p = prop[t]||0, delta = p-c;
    const action = Math.abs(delta) < 0.01 ? 'Hold' : delta>0 ? 'Buy' : 'Sell';
    const sec = findSecurity(t);
    return {ticker:t, name: sec ? sec.name : '', current:c, proposed:p, delta, action};
  }).filter(r=>r.action!=='Hold' || r.current>0);
}

function allocRow(label, curPct, propPct){
  const delta = propPct - curPct;
  const arrow = Math.abs(delta) < 0.5 ? '→' : delta > 0 ? '↑' : '↓';
  return `<tr><td>${label}</td><td>${curPct.toFixed(1)}%</td><td>${propPct.toFixed(1)}%</td><td>${arrow} ${delta>=0?'+':''}${delta.toFixed(1)}pt</td></tr>`;
}

    ${(cap!==null || pref!==null || ps!==null || pp!==null || requiredScore!==null) ? `

        ${proposedLG ? `<div class="pdf-field"><div class="l">Proposed — possible loss / gain</div><div class="v">-$${proposedLG.lossDollar.toLocaleString(undefined,{maximumFractionDigits:0})} (${proposedLG.lossPct.toFixed(1)}%) / +$${proposedLG.gainDollar.toLocaleString(undefined,{maximumFractionDigits:0})} (${proposedLG.gainPct.toFixed(1)}%)</div></div>` : ''}

        const z = 1.036, years = 10;
        const proj = (assump, start) => {
          const mu = assump.ret/100, sigma = assump.vol/100;
          const mean = start * Math.exp((mu-0.5*sigma*sigma)*years);
          const upper = start * Math.exp((mu-0.5*sigma*sigma)*years + z*sigma*Math.sqrt(years));
          const lower = start * Math.exp((mu-0.5*sigma*sigma)*years - z*sigma*Math.sqrt(years));
          return {lower, mean, upper};
        };
        const curP = proj(curAssump, pv), propP = proj(propAssump, ppv || pv);

// Both download functions defer window.print() by two animation frames after
// the innerHTML swap — confirmed necessary in the ECS tool's PDF pipeline:
// calling print() immediately after a large injection can catch the browser
// mid-layout and produce a truncated result. Two rAFs reliably waits for a
// full layout+paint pass to finish first.
function printAfterLayout(){
  requestAnimationFrame(()=>{
    requestAnimationFrame(()=>{
      window.print();
    });
  });
}
function downloadComparisonPDF(cid){
  const c = getClient(cid);
  if(!c) return;
  document.getElementById('printArea').innerHTML = buildComparisonPDF(c);
  printAfterLayout();
}

function downloadClientPDF(cid){
  const c = getClient(cid);
  if(!c) return;
  document.getElementById('printArea').innerHTML = buildClientPDF(c);
  printAfterLayout();
}
window.addEventListener('afterprint', ()=>{ document.getElementById('printArea').innerHTML = ''; });

document.getElementById('toolSwitcher').addEventListener('change', function(){
  if(this.value) window.location.href = this.value;
});
