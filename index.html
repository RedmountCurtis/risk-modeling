function esc(v){ return (v===null||v===undefined||v==='') ? '<span style="color:#bbb;">—</span>' : String(v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
// HTML-attribute-safe escaping for every editable field value/textarea
// content interpolated into generated markup. Every input in this app is
// built as a raw template-literal string (no framework, no auto-escaping),
// so a field value containing a literal double-quote (a client address like
// 123 Main St, Apt "B", a note like cost < budget, a nickname in quotes,
// etc.) previously broke out of the value="..." attribute mid-render,
// corrupting everything after it in that section of the form — silently,
// with no error, no indication anything was wrong. attrEsc() closes that
// gap for both value="${attrEsc(...)}" attributes and textarea content.
function attrEsc(v){
  if(v===null||v===undefined) return '';
  return String(v).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
// Comma-formats dollar-value fields for display only — the underlying stored
// value is always a clean digit string with no commas (parseFloat stops at
// the first non-numeric character, so "400,000" would silently parse as
// just 400 if a comma ever leaked into stored data). Requested specifically
// because "40000" vs "400000" is genuinely hard to eyeball correctly at a
// glance, especially several zeros deep.
function formatMoneyDisplay(v){
  if(v===''||v===null||v===undefined) return '';
  const s = String(v);
  const neg = s.trim().startsWith('-');
  const cleaned = s.replace(/[^\d.]/g,'');
  if(cleaned==='') return neg ? '-' : '';
  const dotIdx = cleaned.indexOf('.');
  let intPart = dotIdx===-1 ? cleaned : cleaned.slice(0,dotIdx);
  let decPart = dotIdx===-1 ? '' : cleaned.slice(dotIdx+1).replace(/\./g,'');
  intPart = intPart.replace(/\B(?=(\d{3})+(?!\d))/g, ',');
  return (neg?'-':'') + intPart + (dotIdx!==-1 ? '.'+decPart : '');
}
// Live-reformats a money input as the person types. Simplification: cursor
// always lands at the end of the field after each keystroke. That's the
// right tradeoff for how these fields actually get used (typing digits left
// to right), at the cost of being a little awkward if someone edits in the
// middle of an existing number — acceptable given the alternative (no
// commas at all) was the actual, reported problem.
function onMoneyInput(el){
  const raw = el.value.replace(/,/g,'');
  el.value = formatMoneyDisplay(raw);
}
// Strips commas back out before a money field's value is actually stored —
// pairs with onMoneyInput/formatMoneyDisplay above.
function moneyVal(v){ return String(v).replace(/,/g,''); }

// ---------- HOLDINGS CSV IMPORT ----------
// Parses one CSV line respecting quoted fields (including embedded commas
// and doubled "" escaped quotes inside quotes) — a plain line.split(',')
// breaks the moment a brokerage export quotes a dollar amount like
// "$15,000.00" or a description containing a comma.
function parseCsvLine(line){
  const out = [];
  let cur = '', inQuotes = false;
  for(let i=0;i<line.length;i++){
    const ch = line[i];
    if(inQuotes){
      if(ch === '"'){
        if(line[i+1] === '"'){ cur += '"'; i++; }
        else inQuotes = false;
      } else cur += ch;
    } else {
      if(ch === '"') inQuotes = true;
      else if(ch === ','){ out.push(cur); cur=''; }
      else cur += ch;
    }
  }
  out.push(cur);
  return out.map(s=>s.trim());
}
function cleanMoneyCell(v){
  if(v===undefined||v===null) return NaN;
  let s = String(v).trim();
  if(s==='') return NaN;
  let neg = false;
  if(/^\(.*\)$/.test(s)){ neg = true; s = s.slice(1,-1); }
  s = s.replace(/[$,]/g,'');
  const n = parseFloat(s);
  if(isNaN(n)) return NaN;
  return neg ? -n : n;
}
function looksLikeTicker(s){ return /^[A-Z][A-Z0-9.\-]{0,9}$/.test(s); }
// Core row-processing logic, shared by both the plain-text CSV/paste path
// and the real Excel (.xlsx) path below — both eventually produce the same
// shape (an array of rows, each row an array of cell strings), so the
// header-detection and extraction logic only needs to exist once.
//
// Column matching is deliberately loose rather than exact: real brokerage
// exports vary their exact header text (Schwab's own Excel export uses
// "Symbol/CUSIP", not "Symbol" — an exact-match check would miss it
// entirely and silently fall through to nothing importing).
function extractHoldingsFromRows(rows){
  let headerIdx = -1, tickerCol = -1, valueCol = -1;
  for(let i=0;i<rows.length;i++){
    const row = rows[i];
    const tCol = row.findIndex(cell=>/^(symbol|ticker)/i.test(cell.trim()));
    if(tCol === -1) continue;
    const vCol = row.findIndex(cell=>/market\s*value|mkt\s*val|current\s*value|^value$|^amount$/i.test(cell.trim()));
    if(vCol === -1) continue;
    headerIdx = i; tickerCol = tCol; valueCol = vCol;
    break;
  }

  const results = [];
  if(headerIdx !== -1){
    for(let i=headerIdx+1;i<rows.length;i++){
      const row = rows[i];
      if(row.length <= Math.max(tickerCol, valueCol)) continue;
      const ticker = (row[tickerCol]||'').trim();
      if(!ticker) continue;
      if(/cash/i.test(ticker)){
        const val = cleanMoneyCell(row[valueCol]);
        if(!isNaN(val) && val > 0) results.push({ticker:'CASH', value: val, assetClassHint:'us_cash'});
        continue;
      }
      const upper = ticker.toUpperCase();
      if(!looksLikeTicker(upper)) continue; // filters "Account Total", footnotes, blank separator rows, etc.
      const val = cleanMoneyCell(row[valueCol]);
      if(isNaN(val) || val <= 0) continue;
      results.push({ticker: upper, value: val});
    }
  } else {
    // No recognizable brokerage-export header found — fall back to the
    // simple two-column TICKER,VALUE paste this box has always accepted.
    for(const row of rows){
      if(row.length < 2) continue;
      let [ticker, value] = row;
      ticker = (ticker||'').trim();
      if(!ticker) continue;
      if(/^[a-zA-Z]/.test(ticker) && isNaN(parseFloat(value))) continue; // header row
      const val = cleanMoneyCell(value);
      if(isNaN(val) || val <= 0) continue;
      results.push({ticker: ticker.toUpperCase(), value: val});
    }
  }

  // Separately: some exports (Schwab's Excel export among them) show an
  // account-level summary block ABOVE the holdings table with a
  // "Total Cash & Cash Investments" figure — real, uninvested cash sitting
  // in the account that is NOT represented by any row in the holdings table
  // itself (it's distinct from a money-market fund ticker, which already
  // gets picked up normally above). Skipping this would understate the
  // account's true total by however much cash is sitting uninvested.
  // Only added if no per-row "cash" holding was already found above, to
  // avoid double-counting on exports that DO list cash as its own row.
  if(!results.some(r=>r.ticker==='CASH')){
    for(let i=0;i<rows.length;i++){
      const col = rows[i].findIndex(cell=>/total\s*cash\s*&?\s*cash\s*investments/i.test(cell.trim()));
      if(col === -1) continue;
      const nextRow = rows[i+1];
      if(!nextRow) break;
      const val = cleanMoneyCell(nextRow[col]);
      if(!isNaN(val) && val > 0) results.push({ticker:'CASH', value: val, assetClassHint:'us_cash'});
      break;
    }
  }

  return results;
}
// Parses either the simple two-column TICKER,VALUE paste this box has
// always accepted, or a real brokerage CSV export — see
// extractHoldingsFromRows for the shared logic both paths funnel into.
function parseHoldingsCSV(text){
  const lines = text.split(/\r?\n/).map(l=>l.replace(/\r$/,'')).filter(l=>l.trim()!=='');
  if(!lines.length) return [];
  const rows = lines.map(parseCsvLine);
  return extractHoldingsFromRows(rows);
}
// Parses a real Excel file (.xlsx/.xls) — Schwab's own "export to Excel"
// option produces this rather than CSV, and it's binary, so it can't go
// through the text-based CSV path at all. Requires the SheetJS library
// (loaded via CDN at the top of this file).
function parseHoldingsWorkbook(arrayBuffer){
  const wb = XLSX.read(arrayBuffer, {type:'array'});
  const sheet = wb.Sheets[wb.SheetNames[0]];
  const rows = XLSX.utils.sheet_to_json(sheet, {header:1, defval:''})
    .map(row => row.map(cell => String(cell)));
  return extractHoldingsFromRows(rows);
}
function readHoldingsCsvFile(file, textareaId, importFn){
  if(!file) return;
  const reader = new FileReader();
  reader.onload = e => { document.getElementById(textareaId).value = e.target.result; importFn(); };
  reader.onerror = () => alert('Could not read that file — please try again.');
  reader.readAsText(file);
}
// Routes a dropped/selected file to the right parser by extension, then
// pushes the resulting holdings straight into the given push function —
// Excel files skip the paste-textarea entirely since there's no sensible
// plain-text staging step for binary spreadsheet data.
function importHoldingsFile(file, pushFn){
  if(!file) return;
  const name = (file.name||'').toLowerCase();
  if(name.endsWith('.xlsx') || name.endsWith('.xls')){
    if(typeof XLSX === 'undefined'){
      alert('Could not load the Excel-reading library (check your internet connection and reload) — or export/save this file as CSV instead and use that.');
      return;
    }
    const reader = new FileReader();
    reader.onload = e => {
      try{
        const rows = parseHoldingsWorkbook(e.target.result);
        if(!rows.length){ alert('Could not find any recognizable holdings in that Excel file — the column layout may not be one this tool recognizes yet. Try exporting as CSV instead, or send this file over so the importer can be taught this format.'); return; }
        pushFn(rows);
      } catch(err){
        alert('Could not read that Excel file: ' + err.message);
      }
    };
    reader.onerror = () => alert('Could not read that file — please try again.');
    reader.readAsArrayBuffer(file);
  } else {
    const reader = new FileReader();
    reader.onload = e => {
      const rows = parseHoldingsCSV(e.target.result);
      pushFn(rows);
    };
    reader.onerror = () => alert('Could not read that file — please try again.');
    reader.readAsText(file);
  }
}

function buildClientPDF(c){
  const cap = riskCapacityScore(c);
  const pref = riskPreferenceScore(c);
  const ps = portfolioScore(c);
  const pv = portfolioValue(c);
  const pp = proposedScore(c);
  const ppv = proposedValue(c);
  const currentBand = inBand(ps, cap, pref);
  const proposedBand = inBand(pp, cap, pref);
  const gapText = currentBand===null ? 'Not enough data to compare yet.'
    : currentBand ? 'Current portfolio falls within the client\'s Risk Band (between Capacity and Preference).'
    : 'Current portfolio falls outside the client\'s Risk Band.';

// ---------- PORTFOLIO CHANGE PROPOSAL REPORT ----------
// groupByAccount (optional, default off — every existing call site omits it,
// so behavior there is unchanged) keys buys/sells by account+ticker instead
// of just ticker, using each holding's .accountName, so a multi-account
// trade list doesn't merge e.g. a SEP-IRA buy with an unrelated 401k holding
// of the same ticker into one blended row.
function buildTradeList(currentHoldings, proposedHoldings, groupByAccount){
  const cur = {}, prop = {}, meta = {};
  const keyOf = h => (groupByAccount ? (h.accountName||'Unassigned')+'||' : '') + h.ticker.trim().toUpperCase();
  currentHoldings.forEach(h=>{ if(!h.ticker) return; const k=keyOf(h); cur[k]=(cur[k]||0)+(parseFloat(h.value)||0); meta[k]={ticker:h.ticker.trim().toUpperCase(), accountName:h.accountName}; });
  proposedHoldings.forEach(h=>{ if(!h.ticker) return; const k=keyOf(h); prop[k]=(prop[k]||0)+(parseFloat(h.value)||0); if(!meta[k]) meta[k]={ticker:h.ticker.trim().toUpperCase(), accountName:h.accountName}; });
  const allKeys = Array.from(new Set([...Object.keys(cur), ...Object.keys(prop)])).sort();
  return allKeys.map(k=>{
    const c = cur[k]||0, p = prop[k]||0, delta = p-c;
    const action = Math.abs(delta) < 0.01 ? 'Hold' : delta>0 ? 'Buy' : 'Sell';
    const t = meta[k].ticker;
    const sec = findSecurity(t);
    return {ticker:t, name: sec ? sec.name : '', accountName: meta[k].accountName, current:c, proposed:p, delta, action};
  }).filter(r=>r.action!=='Hold' || r.current>0);
}

function allocRow(label, curPct, propPct){
  const delta = propPct - curPct;
  const arrow = Math.abs(delta) < 0.5 ? '→' : delta > 0 ? '↑' : '↓';
  return `<tr><td>${label}</td><td>${curPct.toFixed(1)}%</td><td>${propPct.toFixed(1)}%</td><td>${arrow} ${delta>=0?'+':''}${delta.toFixed(1)}pt</td></tr>`;
}

// Shared by buildClientPDF and buildComparisonPDF — a full ticker-by-ticker
// listing (name, risk score, dollar value, % weight) for one side of a
// portfolio. Hoisted out of buildComparisonPDF (where it originally lived
// as a locally-scoped helper) so buildClientPDF can also show an exact,
// line-by-line Proposed Holdings table — previously the main client-facing
// report only ever showed current holdings this way; proposed only showed
// up as buy/sell deltas and asset-class percentages, never as its own full
// per-ticker listing.
// showAccountCol (optional, default off — buildClientPDF's call sites don't
// pass it, so the Annual Review's table is unaffected) adds an Account
// column, reading each holding's .accountName — used by buildComparisonPDF
// when a client has more than one account, so a multi-account holdings
// table doesn't blend accounts together with no way to tell them apart.
function pdfHoldingsTable(holdings, totalValue, showAccountCol){
  const rows = holdings.filter(h=>(parseFloat(h.value)||0)>0).map(h=>{
    const sec = findSecurity(h.ticker);
    const cls = ASSET_CLASSES.find(a=>a.key===h.assetClass);
    const val = parseFloat(h.value)||0;
    const weight = totalValue ? (val/totalValue*100) : 0;
    return `<tr>
      <td>${esc(h.ticker)}</td>
      <td>${sec ? sec.name : (cls ? cls.label : '')}</td>
      ${showAccountCol ? `<td>${esc(h.accountName||'Unassigned')}</td>` : ''}
      <td>${resolveHoldingScore(h) ?? '—'}</td>
      <td>$${val.toLocaleString(undefined,{maximumFractionDigits:0})}</td>
      <td>${weight.toFixed(1)}%</td>
    </tr>`;
  }).join('');
  const colCount = showAccountCol ? 6 : 5;
  return `<table class="pdf-table">
    <thead><tr><th>Ticker</th><th>Name</th>${showAccountCol ? '<th>Account</th>' : ''}<th>Risk</th><th>Value</th><th>Weight</th></tr></thead>
    <tbody>${rows || `<tr><td colspan="${colCount}" style="color:#bbb;">No holdings</td></tr>`}</tbody>
  </table>`;
}

function buildComparisonPDF(c){
  const scenario = activeScenario(c);

  // with nothing else in this scenario being modeled. Every section below
  // that shows a "current" side is gated on this flag so the entire
  // non-proposal-only path renders byte-for-byte as it always has.
  const proposalOnly = scenarioIsProposalOnly(scenario, c);
  // Every account this scenario shows — in-scope real accounts plus any
  // scenario-only hypothetical ones — is what "multi-account" means for this
  // report, not just c.accounts.length: a single-account client who adds a
  // hypothetical "Cash Management Account" to a scenario should get the
  // per-account layout too, and a scenario that excludes down to one real
  // account should fall back to the simple single-account layout.
  const accountsInScenario = scenarioAccounts(scenario, c);
  const multiAccount = accountsInScenario.length > 1;
  // Tag each holding with the display name of the account it belongs to —
  // real account name on the current side, resolved via accountId on the
  // proposed side (falling back to "Unassigned" for a scenario built before
  // per-account tagging, or for holdings never assigned to one). Only
  // materially used when multiAccount, but computed either way since it's
  // cheap and keeps a single code path. scenarioCurrentHoldings (not
  // c.accounts directly) so an account excluded from this scenario doesn't
  // show up on the current side either.
  const currentHoldings = scenarioCurrentHoldings(scenario, c);
  // effectiveProposedHoldings (not the scenario's raw holdings) so an
  // untouched account's current holdings appear here mirrored in as
  // unchanged, rather than the account simply vanishing from the proposed
  // side of the report.
  const proposedHoldings = effectiveProposedHoldings(c).map(h=>{
    const key = accountKeyFor(h, c, scenario);
    const acc = key ? accountsInScenario.find(a=>a.id===key) : null;
    return {...h, accountName: acc ? acc.name : 'Unassigned'};

  const pv = scenarioCurrentValue(scenario, c), ppv = proposedValue(c);

  const currentAlloc = allocationBreakdown(currentHoldings), proposedAlloc = allocationBreakdown(proposedHoldings);
  const trades = buildTradeList(currentHoldings, proposedHoldings, multiAccount);

  // when the scenario has more than one account in play — the whole point
  // being that a scenario can model changes to just one account (e.g. the
  // SEP IRA) while leaving another (the 401k) untouched, or illustrate a
  // brand-new hypothetical account, and the blended figure alone would hide

  const classRows = allClassKeys.map(key=>{
    const label = (ASSET_CLASSES.find(a=>a.key===key)||{}).label || key;

  const currentBand = inBand(ps, cap, pref);

  const currentLG = possibleLossGain(ps, pv), proposedLG = possibleLossGain(pp, ppv);
  const rr = riskRequired(c);
  const requiredScore = rr && typeof rr.score === 'number' ? rr.score : null;
  const currentSector = fieldBreakdown(currentHoldings, 'sector', 'Unclassified');

// Downloads a Blob by momentarily creating and clicking an <a download>
// link — the standard client-side-only way to save a Blob to disk with no
// server round trip.
function downloadPdfBlob(blob, filename){
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

// treatment at all, since drawPageFrame() only ever ran in the e-signature
// path. Unified 2026-09-18: both buttons now render through the same
// verified-correct renderHtmlToPdfBlob() used for e-signature, then save the
// resulting Blob directly, so what a client receives to sign and what an
// advisor downloads are byte-for-byte the same rendering pipeline.
async function downloadComparisonPDF(cid){
  const c = getClient(cid);
  if(!c) return;
  const clientName = [c.client1.first, c.client1.last].filter(Boolean).join(' ') || 'Client';
  const blob = await renderHtmlToPdfBlob(buildComparisonPDF(c), {
    footerTitle: `Portfolio Change Proposal — ${clientName}`,
    overlayText: 'Preparing document…',
    forwardSnapTolerancePx: 24
  });
  downloadPdfBlob(blob, `Portfolio Proposal - ${clientName}.pdf`);
}

async function downloadClientPDF(cid){
  const c = getClient(cid);
  if(!c) return;
  const blob = await generateClientPdfBlob(c);
  const clientName = [c.client1.first, c.client1.last].filter(Boolean).join(' ') || 'Client';
  downloadPdfBlob(blob, `Annual Review - ${clientName}.pdf`);
}

document.getElementById('toolSwitcher').addEventListener('change', function(){
  if(this.value) window.location.href = this.value;
});
initAuth();
</script>
</body>
